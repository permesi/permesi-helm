suite: permesi Deployment
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
values:
  - published-values.yaml
tests:
  - it: renders default grace period, seccomp, and pod automount
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: renders with ESO disabled and tls.externalSecret null
    set:
      tls.externalSecret: null
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  # An explicit entry wins over envFrom, so a shared ConfigMap or Secret cannot switch
  # an opt-out on while the chart value says off.
  - it: sets the transport opt-outs to false explicitly by default
    set:
      extraEnvFrom:
        - configMapRef:
            name: shared-settings
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DB_ALLOW_UNVERIFIED_TLS
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ALLOW_INSECURE_HTTP
            value: "false"

  # `helm upgrade --reuse-values` from chart 0.6.1, which had neither value, passes
  # them as null. An empty variable would stop a newer image from starting.
  - it: renders a missing transport opt-out as false
    set:
      database.allowUnverifiedTls: null
      openbao.allowInsecureHttp: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DB_ALLOW_UNVERIFIED_TLS
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ALLOW_INSECURE_HTTP
            value: "false"

  - it: refuses a transport opt-out smuggled in through extraEnv
    set:
      extraEnv:
        - name: PERMESI_DB_ALLOW_UNVERIFIED_TLS
          value: "true"
    asserts:
      - failedTemplate:
          errorPattern: "database.allowUnverifiedTls"

  - it: refuses the OpenBao opt-out in extraEnv as well
    set:
      extraEnv:
        - name: PERMESI_OPENBAO_ALLOW_INSECURE_HTTP
          value: "true"
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values"

  - it: passes the transport opt-outs only when a development cluster asks for them
    set:
      database.allowUnverifiedTls: true
      openbao.allowInsecureHttp: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DB_ALLOW_UNVERIFIED_TLS
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ALLOW_INSECURE_HTTP
            value: "true"

  - it: accepts only booleans for the transport opt-outs
    set:
      database.allowUnverifiedTls: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "allowUnverifiedTls"

  - it: refuses an operator elevation lifetime the service would not start with
    set:
      auth.platformAdminTtlSeconds: 46801
    asserts:
      - failedTemplate:
          errorPattern: "platformAdminTtlSeconds"

  - it: accepts the longest operator elevation lifetime
    set:
      auth.platformAdminTtlSeconds: 46800
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_ADMIN_TTL_SECONDS
            value: "46800"

  - it: uses the inline DSN value by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DSN
            value: postgres://postgres@postgres-permesi:5432/permesi?sslmode=verify-full
          any: true

  - it: consumes explicit existingSecret names
    set:
      database.dsn.existingSecret: permesi-db
      tls.existingSecret: permesi-tls
      openbao.roleId.existingSecret: permesi-openbao
      openbao.secretId.existingSecret: permesi-openbao
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DSN
            valueFrom:
              secretKeyRef:
                name: permesi-db
                key: dsn
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: permesi-openbao
                key: role_id
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: permesi-openbao
                key: secret_id
          any: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: permesi-tls

  - it: consumes ESO-generated names when remote keys are set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.value: ""
      database.dsn.externalSecret.remoteKey: db-remote
      tls.externalSecret.remoteKey: tls-remote
      openbao.externalSecret.remoteKey: openbao-remote
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_DSN
            valueFrom:
              secretKeyRef:
                name: permesi-db
                key: dsn
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: permesi-openbao
                key: role_id
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: permesi-openbao
                key: secret_id
          any: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: permesi-tls
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-bundle
            mountPath: /var/run/permesi/tls
            readOnly: true
          any: true

  - it: uses the lone secretId existingSecret for both OpenBao env vars
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao-remote
      openbao.secretId.existingSecret: custom-openbao
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: custom-openbao
                key: role_id
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: custom-openbao
                key: secret_id
          any: true

  - it: omits port and TLS env in socket mode
    set:
      config.socketPath: /var/run/permesi/permesi.sock
      service.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_SOCKET_PATH
            value: /var/run/permesi/permesi.sock
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_PORT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_TLS_PEM_BUNDLE
          any: true

  - it: omits replicas when autoscaling is enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 6
    asserts:
      - notExists:
          path: spec.replicas
