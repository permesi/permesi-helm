{{- if not .Values.bootstrap.credentialsSecret }}
{{- $fullname := include "quickstart.fullname" . -}}
# Generates the bootstrap-only credentials Secret exactly once (never
# regenerates or reads it). Values never pass through Helm (no release-history
# copies, no rotation on upgrade). The Secret is NOT Helm-owned: it survives
# `helm uninstall`; delete it explicitly (or the namespace) for a dev reset.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  ttlSecondsAfterFinished: {{ .Values.credentialsJob.ttlSecondsAfterFinished }}
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "quickstart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials
    spec:
      serviceAccountName: {{ $fullname }}-credentials
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate-credentials
          image: {{ include "quickstart.image" .Values.vault.image }}
          imagePullPolicy: {{ .Values.vault.image.pullPolicy }}
          command: ["sh", "/scripts/generate-credentials.sh"]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SECRET_NAME
              value: {{ include "quickstart.credentialsSecretName" . | quote }}
            - name: INSTANCE
              value: {{ .Release.Name | quote }}
          securityContext:
            {{- include "quickstart.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ $fullname }}-scripts
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
