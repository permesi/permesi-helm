suite: genesis ExternalSecret targets
release:
  name: my-release
templates:
  - external-secret.yaml
tests:
  - it: targets the generated db name when only remoteKey is set
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      database.dsn.externalSecret.remoteKey: db/creds
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-db

  - it: targets the explicit db name over the generated one
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      database.dsn.existingSecret: my-db-secret
      database.dsn.externalSecret.remoteKey: db/creds
    asserts:
      - equal:
          path: spec.target.name
          value: my-db-secret

  - it: targets the generated tls name
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      tls.externalSecret.remoteKey: tls/cert
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-tls

  - it: targets the generated vault name and writes both credentials
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      vault.externalSecret.remoteKey: vault/approle
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-vault
      - lengthEqual:
          path: spec.data
          count: 2

  - it: targets the explicit vault name when roleId.existingSecret is set
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      vault.externalSecret.remoteKey: vault/approle
      vault.roleId.existingSecret: my-vault-secret
    asserts:
      - equal:
          path: spec.target.name
          value: my-vault-secret
