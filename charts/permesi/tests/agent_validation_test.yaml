suite: permesi vault agent validation
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: fails below Kubernetes 1.29
    capabilities:
      majorVersion: 1
      minorVersion: 28
    set:
      vault.agent.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "requires Kubernetes >= 1.29"

  - it: rejects an http(s) Vault target
    set:
      vault.agent.enabled: true
      vault.url: https://vault.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "vault.url must be a Unix socket path"

  - it: rejects a relative Vault socket path
    set:
      vault.agent.enabled: true
      vault.url: var/run/agent.sock
    asserts:
      - failedTemplate:
          errorPattern: "absolute socket path"

  - it: requires an agent address
    set:
      vault.agent.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "vault.agent.address must be an http(s) URL"

  - it: requires a Kubernetes auth role
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "vault.agent.auth.role must be set"

  - it: rejects AppRole credentials
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.roleId.value: some-role-id
    asserts:
      - failedTemplate:
          errorPattern: "roleId/secretId/wrappedToken must not be set"

  - it: rejects Vault ESO credentials
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      externalSecret.enabled: true
      externalSecret.store: vault-store
      vault.externalSecret.remoteKey: vault/approle
    asserts:
      - failedTemplate:
          errorPattern: "vault.externalSecret.remoteKey must not be set"

  - it: rejects a TLS Secret when the agent manages TLS
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      tls.existingSecret: my-tls
    asserts:
      - failedTemplate:
          errorPattern: "tls Secret/ESO must not be set"

  - it: rejects a TLS ExternalSecret when the agent manages TLS
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      externalSecret.enabled: true
      externalSecret.store: vault-store
      tls.externalSecret.remoteKey: tls/cert
    asserts:
      - failedTemplate:
          errorPattern: "tls Secret/ESO must not be set"

  - it: requires a PKI role in TCP mode
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
    asserts:
      - failedTemplate:
          errorPattern: "vault.agent.pki.role must be set"

  - it: requires a PKI common name in TCP mode
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
    asserts:
      - failedTemplate:
          errorPattern: "vault.agent.pki.commonName must be set"

  - it: requires at least one PKI SAN in TCP mode
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
    asserts:
      - failedTemplate:
          errorPattern: "dnsNames must contain at least one SAN"

  - it: rejects a PASERK CA Secret when the agent manages it
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      admission.paserkCa.existingSecret: my-ca
    asserts:
      - failedTemplate:
          errorPattern: "admission.paserkCa Secret/ESO must not be set"

  - it: rejects injector annotations
    values:
      - agent_injector_values.yaml
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "injector annotations must not be used"

  - it: rejects duplicate chart-owned env entries
    values:
      - agent_extraenv_values.yaml
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv must not redefine"

  - it: rejects reserved volume names
    values:
      - agent_extravolumes_values.yaml
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "reserved volume names"

  - it: requires a nonroot UID/GID and fsGroup
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      securityContext.runAsUser: 0
    asserts:
      - failedTemplate:
          errorPattern: "must be positive integers"

  - it: requires automountServiceAccountToken to be false
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: true
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.automount must be false"

  - it: rejects an out-of-range renewal threshold
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      vault.agent.pki.renewalThreshold: 1
    asserts:
      - failedTemplate:
          errorPattern: "renewalThreshold must be strictly between 0 and 1"

  - it: rejects distinct destinations sharing a directory
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /var/run/secrets/vaultproject.io/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects nested destination directories
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /var/run/secrets/vaultproject.io/tls/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects a TLS destination colliding with the agent scratch mount
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /tmp/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects extra volume mounts colliding with a chart destination
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      extraVolumeMounts[0].name: extra
      extraVolumeMounts[0].mountPath: /var/run/permesi/tls
    asserts:
      - failedTemplate:
          errorPattern: "extraVolumeMounts must not overlap"

  - it: rejects a relative TLS destination
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: permesi
      vault.agent.pki.role: permesi-runtime
      vault.agent.pki.commonName: api.permesi.dev
      vault.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "tls.pemBundlePath must be an absolute path"
