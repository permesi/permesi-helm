suite: genesis image digest
release:
  name: genesis
  namespace: genesis
templates:
  - deployment.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
values:
  - published-values.yaml
tests:
  - it: rejects an application image without a digest
    set:
      image.digest: ""
      image.tag: 9.9.9
    asserts:
      - failedTemplate:
          errorPattern: "require pinned application and OpenBao Agent images"

  - it: pins repository@digest when a digest is set, ignoring the tag
    set:
      image.tag: 9.9.9
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/permesi/genesis@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: rejects a malformed digest via the schema
    set:
      image.digest: sha256:ABC
    asserts:
      - failedTemplate:
          errorPattern: "image\\.digest: Does not match pattern"

  - it: rejects a digest without the sha256 prefix
    set:
      image.digest: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - failedTemplate:
          errorPattern: "image\\.digest: Does not match pattern"

  - it: pins the OpenBao Agent image by digest independently of the app image
    set:
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      image.tag: 9.9.9
      openbao.agent.image.tag: 9.8.7
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.role: genesis-runtime
      openbao.agent.pki.commonName: genesis.permesi.svc.cluster.local
      openbao.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
      serviceAccount.automount: false
      openbao.agent.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/openbao/openbao@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/permesi/genesis@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: rejects an OpenBao Agent image without a digest
    set:
      openbao.agent.image.digest: ""
      openbao.agent.image.tag: 9.8.7
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.role: genesis-runtime
      openbao.agent.pki.commonName: genesis.permesi.svc.cluster.local
      openbao.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
      serviceAccount.automount: false
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "require pinned application and OpenBao Agent images"

  - it: rejects an Agent image that is not OpenBao
    set:
      openbao.agent.image.repository: hashicorp/vault
      openbao.agent.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.role: genesis-runtime
      openbao.agent.pki.commonName: genesis.permesi.svc.cluster.local
      openbao.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "require pinned application and OpenBao Agent images"

  - it: rejects a malformed OpenBao Agent digest via the schema
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.role: genesis-runtime
      openbao.agent.pki.commonName: genesis.permesi.svc.cluster.local
      openbao.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
      serviceAccount.automount: false
      openbao.agent.image.digest: "sha256:gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg"
    asserts:
      - failedTemplate:
          errorPattern: "image\\.digest: Does not match pattern"
