---
apiVersion: v2
name: permesi-stack
description: Umbrella chart for permesi, genesis, and web components.
type: application
version: 0.4.6
appVersion: 0.4.3
dependencies:
  - name: permesi
    version: 0.4.6
    repository: file://../permesi
    condition: permesi.enabled
  - name: genesis
    version: 0.4.6
    repository: file://../genesis
    condition: genesis.enabled
  - name: web
    version: 0.4.6
    repository: file://../web
    condition: web.enabled
  - name: permesi-quickstart
    alias: quickstart
    version: 0.1.0
    repository: file://../../scripts/quickstart/chart
    condition: quickstart.enabled
