apiVersion: v1
kind: Service
metadata:
  name: {{ include "quickstart.vaultServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  type: ClusterIP
  selector:
    {{- include "quickstart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vault
  ports:
    - name: http
      port: {{ .Values.vault.service.port }}
      targetPort: http
