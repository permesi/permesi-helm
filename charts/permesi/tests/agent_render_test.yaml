suite: permesi OpenBao Agent render
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
values:
  - published-values.yaml
tests:
  - it: renders native sidecar, shared volumes, and agent-only token projection
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - exists:
          path: spec.template.metadata.annotations["checksum/openbao-agent-config"]
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: openbao-agent
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: ["/usr/bin/bao"]
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      # Agent mounts the projected token; the app does not
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: openbao-agent-token
            mountPath: /var/run/secrets/openbao-token
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openbao-agent-token
      # App mounts the shared artifacts read-only
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-bundle
            mountPath: /var/run/permesi/tls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openbao-agent-socket
            mountPath: /var/run/secrets/openbao
            readOnly: true
      # Memory emptyDirs for socket and TLS; admission trust comes from OpenBao KV
      - contains:
          path: spec.template.spec.volumes
          content:
            name: openbao-agent-socket
            emptyDir:
              medium: Memory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-bundle
            emptyDir:
              medium: Memory
      # Projected token with audience and bounded expiry
      - contains:
          path: spec.template.spec.volumes
          content:
            name: openbao-agent-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: openbao
                    expirationSeconds: 3600
              defaultMode: 0400
      # Startup probe performs an authenticated tokenless lookup plus file checks
      - equal:
          path: spec.template.spec.initContainers[0].startupProbe.failureThreshold
          value: 120
      - matchRegex:
          path: spec.template.spec.initContainers[0].startupProbe.exec.command[2]
          pattern: 'bao token lookup -address="unix:///var/run/secrets/openbao/agent.sock"'
      - matchRegex:
          path: spec.template.spec.initContainers[0].startupProbe.exec.command[2]
          pattern: 'test -s "/var/run/permesi/tls/bundle.pem"'

  - it: omits the inbound PKI template in socket mode
    set:
      config.socketPath: /var/run/permesi/permesi.sock
      service.enabled: false
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      serviceAccount.automount: false
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls-bundle
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openbao-agent-socket
            mountPath: /var/run/secrets/openbao
            readOnly: true
