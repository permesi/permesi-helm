---
name: Charts CI

on:
  pull_request:
    paths:
      - charts/**
      - docs/examples/**
      - scripts/quickstart/**
      - scripts/ci/**
      - scripts/bump-release.sh
      - .github/workflows/release-bump-pr.yml
      - .ct.yaml
      - .github/workflows/charts-ci.yml
  push:
    branches:
      - main
    paths:
      - charts/**
      - docs/examples/**
      - scripts/quickstart/**
      - scripts/ci/**
      - scripts/bump-release.sh
      - .github/workflows/release-bump-pr.yml
      - .ct.yaml
      - .github/workflows/charts-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release and verifier contracts
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/ci/test-release.py
          python3 -m unittest discover -s scripts/quickstart/tests -p 'test_*.py' -v

  lint:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changed.outputs.has_changes }}
      target_branch: ${{ steps.meta.outputs.target_branch }}
      mode: ${{ steps.meta.outputs.mode }}
      real_deps_needed: ${{ steps.realdeps.outputs.real_deps_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup Python for chart-testing
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup chart-testing
        uses: helm/chart-testing-action@v2

      - name: Check chart-testing Python
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2

      - name: Test chart consumer contracts
        run: |
          uv pip install PyYAML==6.0.3
          python3 scripts/ci/test-chart-contracts.py -v

      - name: Resolve chart test mode
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "target_branch=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "target_branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed charts
        id: changed
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          set -euo pipefail

          if [[ "${MODE}" == "all" ]]; then
            echo "Push to main detected, running chart checks in --all mode."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(ct list-changed --target-branch "${TARGET_BRANCH}" --config .ct.yaml)"
          if [[ -n "${changed}" ]]; then
            echo "Changed charts:"
            echo "${changed}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No chart changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect real-dependency changes
        id: realdeps
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "all" ]]; then
            echo "real_deps_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${TARGET_BRANCH}"...HEAD -- charts docs/examples scripts/quickstart scripts/ci .github/workflows/charts-ci.yml .ct.yaml)"
          if [[ -n "${changed}" ]]; then
            echo "real_deps_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "real_deps_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ct lint (all charts)
        if: steps.changed.outputs.has_changes == 'true' && steps.meta.outputs.mode
          == 'all'
        run: ct lint --all --config .ct.yaml

      - name: Run ct lint (changed charts)
        if: steps.changed.outputs.has_changes == 'true' && steps.meta.outputs.mode
          == 'changed'
        env:
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
        run: ct lint --target-branch "${TARGET_BRANCH}" --config .ct.yaml

      - name: Run helm unit tests
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran_any=false
          for chart in charts/*; do
            [[ -d "${chart}/tests" ]] || continue
            ran_any=true
            echo "Running helm unittest for ${chart}"
            helm unittest "${chart}"
          done
          if [[ "${ran_any}" == "false" ]]; then
            echo "No chart unit tests found (no charts/*/tests directories)."
          fi

      - name: Render production profile
        shell: bash
        run: |
          set -euo pipefail
          helm dependency build charts/permesi-stack
          helm template permesi charts/permesi-stack -n permesi -f docs/examples/production-stack.yaml > /dev/null

  install:
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup Python for chart-testing
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup chart-testing
        uses: helm/chart-testing-action@v2

      - name: Check chart-testing Python
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Setup Kind
        uses: helm/kind-action@v1

      - name: Run ct install (all charts)
        if: needs.lint.outputs.mode == 'all'
        run: ct install --all --config .ct.yaml

      - name: Run ct install (changed charts)
        if: needs.lint.outputs.mode == 'changed'
        env:
          TARGET_BRANCH: ${{ needs.lint.outputs.target_branch }}
        run: ct install --target-branch "${TARGET_BRANCH}" --config .ct.yaml

  kind-smoke:
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup Kind
        uses: helm/kind-action@v1

      - name: Run kind smoke checks
        env:
          BASE_REF: origin/${{ needs.lint.outputs.target_branch }}
        run: bash scripts/ci/kind-smoke.sh

  real-dependencies:
    # Exact quickstart entry points against real PostgreSQL + dev Vault.
    # Not gated on `ct list-changed` (script-only changes must also run).
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.real_deps_needed == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout app SQL at locked commit (read-only)
        uses: actions/checkout@v7
        with:
          repository: permesi/permesi
          ref: 04783bc009cdef4e8ba71910c12ecbd25aa74dfd
          path: app
          persist-credentials: false
          sparse-checkout: db/sql

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup Rust for the real OPAQUE smoke client
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Validate quickstart chart contracts
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2
          helm lint scripts/quickstart/chart --set acknowledgeDevelopment=true
          helm unittest scripts/quickstart/chart

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          kubectl_version: v1.32.2
          wait: 300s

      - name: Run real-dependency quickstart (install + verify + rerun)
        shell: bash
        env:
          QS_APP_SOURCE: app
        run: bash scripts/ci/real-dependencies.sh

      - name: Test custom endpoints and bootstrap lifecycle
        run: |
          python3 scripts/quickstart/tests/real-configuration-regressions.py \
            --context "$(kubectl config current-context)" --namespace qv-config-ci --release config \
            --app-source app
