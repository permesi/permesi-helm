suite: permesi OpenBao Agent validation
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
values:
  - published-values.yaml
tests:
  - it: fails below Kubernetes 1.29
    capabilities:
      majorVersion: 1
      minorVersion: 28
    set:
      openbao.agent.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "requires Kubernetes >= 1.29"

  - it: rejects an http(s) OpenBao target
    set:
      openbao.agent.enabled: true
      openbao.url: https://openbao.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "openbao.url must be a Unix socket path"

  - it: rejects a relative OpenBao socket path
    set:
      openbao.agent.enabled: true
      openbao.url: var/run/agent.sock
    asserts:
      - failedTemplate:
          errorPattern: "absolute socket path"

  - it: requires an agent address
    set:
      openbao.agent.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "openbao.agent.address must be an http(s) URL"

  - it: requires a Kubernetes auth role
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "openbao.agent.auth.role must be set"

  - it: rejects AppRole credentials
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.roleId.value: some-role-id
    asserts:
      - failedTemplate:
          errorPattern: "roleId/secretId/wrappedToken must not be set"

  - it: rejects OpenBao ESO credentials
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
    asserts:
      - failedTemplate:
          errorPattern: "openbao.externalSecret.remoteKey must not be set"

  - it: rejects a TLS Secret when the agent manages TLS
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      tls.existingSecret: my-tls
    asserts:
      - failedTemplate:
          errorPattern: "tls Secret/ESO must not be set"

  - it: rejects a TLS ExternalSecret when the agent manages TLS
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      tls.externalSecret.remoteKey: tls/cert
    asserts:
      - failedTemplate:
          errorPattern: "tls Secret/ESO must not be set"

  - it: requires a PKI role in TCP mode
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
    asserts:
      - failedTemplate:
          errorPattern: "openbao.agent.pki.role must be set"

  - it: requires a PKI common name in TCP mode
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
    asserts:
      - failedTemplate:
          errorPattern: "openbao.agent.pki.commonName must be set"

  - it: requires at least one PKI SAN in TCP mode
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
    asserts:
      - failedTemplate:
          errorPattern: "dnsNames must contain at least one SAN"

  - it: rejects injector annotations
    values:
      - agent_injector_values.yaml
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "injector annotations must not be used"

  - it: rejects duplicate chart-owned env entries
    values:
      - agent_extraenv_values.yaml
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "extraEnv must not redefine"

  - it: rejects reserved volume names
    values:
      - agent_extravolumes_values.yaml
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "reserved volume names"

  - it: requires a nonroot UID/GID and fsGroup
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      securityContext.runAsUser: 0
    asserts:
      - failedTemplate:
          errorPattern: "must be positive integers"

  - it: requires automountServiceAccountToken to be false
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: true
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.automount must be false"

  - it: rejects a renewal threshold of exactly 1
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      openbao.agent.pki.renewalThreshold: 1
    asserts:
      - failedTemplate:
          errorPattern: "renewalThreshold: Must be less than 1"

  - it: rejects a zero renewal threshold
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      openbao.agent.pki.renewalThreshold: 0
    asserts:
      - failedTemplate:
          errorPattern: "renewalThreshold: Must be greater than 0"

  - it: rejects a negative renewal threshold
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      openbao.agent.pki.renewalThreshold: -0.5
    asserts:
      - failedTemplate:
          errorPattern: "renewalThreshold: Must be greater than 0"

  - it: rejects distinct destinations sharing a directory
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /var/run/secrets/openbao/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects nested destination directories
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /var/run/secrets/openbao/tls/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects a TLS destination colliding with the agent scratch mount
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /tmp/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects extra volume mounts colliding with a chart destination
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      extraVolumeMounts:
        - name: extra
          mountPath: /var/run/permesi/tls
    asserts:
      - failedTemplate:
          errorPattern: "extraVolumeMounts must not overlap"

  - it: rejects an extra volume mount at the root directory
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      extraVolumeMounts:
        - name: extra
          mountPath: /
    asserts:
      - failedTemplate:
          errorPattern: "extraVolumeMounts must not overlap"

  - it: rejects a TLS destination directly in the root directory
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "tls.pemBundlePath must be inside a dedicated directory, not directly in /"

  - it: rejects an OpenBao socket directly in the root directory
    set:
      openbao.agent.enabled: true
      openbao.url: unix:///agent.sock
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
    asserts:
      - failedTemplate:
          errorPattern: "openbao.url socket must be inside a dedicated directory, not directly in /"

  - it: rejects a relative TLS destination
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "tls.pemBundlePath must be an absolute path"

  - it: accepts an inactive TLS destination in socket mode
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      serviceAccount.automount: false
      config.socketPath: /run/app/app.sock
      service.enabled: false
      tls.pemBundlePath: /var/run/secrets/openbao/agent.sock
    asserts:
      - notFailedTemplate: {}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls-bundle
          any: true

  - it: rejects an agent-managed TLS destination in the socket directory
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
      serviceAccount.automount: false
      tls.pemBundlePath: /var/run/secrets/openbao/agent.sock
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"

  - it: rejects a legacy TLS Secret mount in the socket directory in socket mode
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      serviceAccount.automount: false
      config.socketPath: /run/app/app.sock
      service.enabled: false
      tls.existingSecret: permesi-tls
      tls.pemBundlePath: /var/run/secrets/openbao/bundle.pem
    asserts:
      - failedTemplate:
          errorPattern: "destination mount directories must not overlap"
