suite: genesis OpenBao Agent configmap
release:
  name: my-release
  namespace: genesis
templates:
  - configmap-openbao-agent.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
values:
  - published-values.yaml
tests:
  - it: renders the agent HCL with proxy auth token, no force, no cache
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.role: genesis-runtime
      openbao.agent.pki.commonName: genesis.permesi.svc.cluster.local
      openbao.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
    asserts:
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'use_auto_auth_token = true'
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: 'use_auto_auth_token = "?force"?'
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: '(?m)^cache\s*\{'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'mount_path = "auth/kubernetes"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'socket_mode  = "0600"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'error_on_missing_key = true'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'lease_renewal_threshold = 0.8'
      - matchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '\{\{ \.Data\.Key \}\}\{\{ \.Data\.Cert \}\}\{\{ with secret "pki-int/cert/ca_chain" \}\}\{\{ \.Data\.certificate \}\}\{\{ end \}\}'
      - notMatchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '\{\{ \.Data\.CA \}\}'
      - matchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '"pki-int/issue/genesis-runtime"'
      - notExists:
          path: data["paserk-ca.tpl"]

  - it: omits the inbound PKI template in socket mode
    set:
      config.socketPath: /run/genesis.sock
      service.enabled: false
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
    asserts:
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: 'tls-bundle.tpl'

  - it: renders an explicit fractional renewal threshold
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: genesis
      openbao.agent.pki.renewalThreshold: 0.8
    asserts:
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'lease_renewal_threshold = 0.8'
