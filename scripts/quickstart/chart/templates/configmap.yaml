apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quickstart.fullname" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
data:
  {{- range $f := list "fetch-schema.sh" "sql-bootstrap.sh" "vault-bootstrap.sh" "generate-credentials.sh" "start-dev-vault.sh" }}
  {{ $f }}: |
    {{- $.Files.Get (printf "files/%s" $f) | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quickstart.fullname" . }}-policies
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/policies/*.hcl" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
