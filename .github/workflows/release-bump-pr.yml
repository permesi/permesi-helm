---
name: Release Bump PR

on:
  repository_dispatch:
    types:
      - permesi-release
  workflow_dispatch:
    inputs:
      version:
        description: Release version to bump (X.Y.Z or vX.Y.Z)
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            raw="${{ github.event.client_payload.version }}"
            source_repo="${{ github.event.client_payload.source_repo }}"
            source_sha="${{ github.event.client_payload.source_sha }}"
            source_tag="${{ github.event.client_payload.source_tag }}"
          else
            raw="${{ inputs.version }}"
            source_repo="manual"
            source_sha="manual"
            source_tag="manual"
          fi

          version="${raw#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected X.Y.Z or vX.Y.Z, got '${raw}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_repo=${source_repo}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${source_tag}" >> "$GITHUB_OUTPUT"

      - name: Bump chart versions
        run: ./scripts/bump-release.sh "${{ steps.meta.outputs.version }}"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/release-${{ steps.meta.outputs.version }}
          delete-branch: true
          sign-commits: true
          commit-message: 'chore(release): bump charts to ${{ steps.meta.outputs.version }}'
          title: 'chore(release): bump charts to ${{ steps.meta.outputs.version }}'
          body: |
            Automated release bump.

            - Version: `${{ steps.meta.outputs.version }}`
            - Source repo: `${{ steps.meta.outputs.source_repo }}`
            - Source SHA: `${{ steps.meta.outputs.source_sha }}`
            - Source tag: `${{ steps.meta.outputs.source_tag }}`
          labels: |-
            automation
            release

      - name: Enable pull request auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Wait for pull request merge
        if: steps.cpr.outputs.pull-request-number != ''
        id: merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            merge_sha="$(gh pr view "${PR_NUMBER}" --json mergeCommit,mergedAt --jq 'if .mergedAt == null then "" else .mergeCommit.oid end')"
            if [[ -n "${merge_sha}" ]]; then
              echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for PR #${PR_NUMBER} to merge." >&2
          exit 1

      - name: Trigger Charts CI on main
        if: steps.merged.outputs.merge_sha != ''
        id: charts_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_output="$(gh workflow run "Charts CI" --ref main 2>&1)"
          if [[ -n "${dispatch_output}" ]]; then
            echo "${dispatch_output}"
          fi

          run_id="$(printf '%s\n' "${dispatch_output}" | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | head -n1)"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow "Charts CI" --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"${MERGE_SHA}\") | .databaseId" | head -n1 || true)"
          fi
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow "Charts CI" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          fi

          if [[ -z "${run_id}" ]]; then
            echo "Could not determine Charts CI run id." >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for Charts CI completion
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.charts_ci.outputs.run_id }}" --exit-status

      - name: Trigger Auto Release on main
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "Auto Release" --ref main -f head_sha="${MERGE_SHA}"
