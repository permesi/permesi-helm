---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/permesi/permesi
  tag: 0.4.3
  # Optional sha256:<64 hex> digest. When set it replaces the tag in the
  # image reference (repository@digest); clear it when changing the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  port: 8080
  socketPath: ""
  logLevel: info

database:
  dsn:
    value: postgres://postgres@postgres-permesi:5432/permesi?sslmode=disable
    existingSecret: ""
    secretKey: dsn
    externalSecret:
      remoteKey: ""
      remoteProperty: ""

tls:
  pemBundlePath: /var/run/permesi/tls/bundle.pem
  existingSecret: ""
  secretKey: bundle.pem
  externalSecret:
    remoteKey: ""
    remoteProperty: ""

admission:
  paserkUrl: https://genesis.permesi.svc.cluster.local:8080/paserk.json
  issuer: ""
  audience: ""
  paserkCaPath: ""
  paserkCa:
    existingSecret: ""
    secretKey: ca.pem
    mountPath: /var/run/permesi/admission-ca
    fileName: ca.pem
    externalSecret:
      remoteKey: ""
      remoteProperty: ""

vault:
  url: /var/run/secrets/vaultproject.io/agent.sock
  externalSecret:
    remoteKey: ""
    roleIdProperty: ""
    secretIdProperty: ""
  roleId:
    value: ""
    existingSecret: ""
    secretKey: role_id
  secretId:
    value: ""
    existingSecret: ""
    secretKey: secret_id
  wrappedToken:
    value: ""
    existingSecret: ""
    secretKey: wrapped_token
  kvMount: secret/permesi
  kvPath: config
  transitMount: transit/permesi
  # Managed Vault Agent sidecar (native sidecar, Kubernetes >= 1.29).
  # Off by default: existing renders are byte-identical with agent disabled.
  agent:
    enabled: false
    # HTTP(S) origin of Vault the agent authenticates against. Independent of
    # vault.url (the Unix socket the application connects to).
    address: ""
    image:
      repository: hashicorp/vault
      tag: 1.20.4
      # Optional sha256:<64 hex> digest. When set it replaces the tag in the
      # image reference (repository@digest); clear it when changing the tag.
      digest: ""
      pullPolicy: IfNotPresent
    auth:
      mount: kubernetes
      role: ""
      audience: vault
      tokenExpirationSeconds: 3600
    ca:
      existingConfigMap: ""
      key: ca.crt
    pki:
      mount: pki-int
      role: ""
      commonName: ""
      dnsNames: []
      ttl: 24h
      renewalThreshold: 0.8
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 120
    paserkCa:
      enabled: true
      path: pki-int/cert/ca_chain

auth:
  frontendBaseUrl: https://permesi.dev
  corsAllowedOrigins: ""
  emailTokenTtlSeconds: 1800
  emailResendCooldownSeconds: 60
  sessionTtlSeconds: 604800
  emailOutboxPollSeconds: 5
  emailOutboxBatchSize: 10
  emailOutboxMaxAttempts: 5
  emailOutboxBackoffBaseSeconds: 5
  emailOutboxBackoffMaxSeconds: 300
  opaqueServerId: api.permesi.dev
  opaqueLoginTtlSeconds: 300
  platformAdminTtlSeconds: 43200
  platformRecentAuthSeconds: 3600

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: permesi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  readiness:
    enabled: true
    path: /ready
    scheme: HTTPS
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    path: /live
    scheme: HTTPS
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 60
revisionHistoryLimit: 5

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

externalSecret:
  enabled: false
  store: ""
  storeKind: ClusterSecretStore
  refreshInterval: 1h
