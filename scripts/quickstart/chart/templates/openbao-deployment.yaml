{{- $fullname := include "quickstart.fullname" . -}}
# Dev-mode OpenBao: in-memory storage, auto-unsealed, HTTP on ClusterIP only.
# Recreating this pod loses every key, PKI issuer and seed (see NOTES).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quickstart.openbaoServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quickstart.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quickstart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: openbao
  template:
    metadata:
      labels:
        {{- include "quickstart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openbao
    spec:
      serviceAccountName: {{ $fullname }}-openbao
      # OpenBao's own API-audience token is its Kubernetes-auth reviewer JWT.
      automountServiceAccountToken: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        {{- if .Values.qualificationObservations }}
        fsGroup: 1000
        {{- end }}
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: {{ include "quickstart.image" .Values.openbao.image }}
          imagePullPolicy: {{ .Values.openbao.image.pullPolicy }}
          command: ["sh", "/scripts/start-dev-openbao.sh"]
          {{- if .Values.qualificationObservations }}
          args: ["-config=/scripts/audit.hcl"]
          {{- end }}
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "quickstart.credentialsSecretName" . }}
                  key: openbao-root-token
            # Same root credential (already present above) for operator `bao`
            # CLI exec by verify.sh/connect.sh. Dev-only.
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "quickstart.credentialsSecretName" . }}
                  key: openbao-root-token
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            - name: BAO_API_ADDR
              value: {{ include "quickstart.openbaoAddr" . | quote }}
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8200
          securityContext:
            {{- include "quickstart.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            {{- if .Values.qualificationObservations }}
            - name: audit
              mountPath: /audit
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
      volumes:
        {{- if .Values.qualificationObservations }}
        - name: audit
          emptyDir: {sizeLimit: 128Mi}
        {{- end }}
        - name: scripts
          configMap:
            name: {{ $fullname }}-scripts
            items:
              {{- if .Values.qualificationObservations }}
              - key: audit.hcl
                path: audit.hcl
              {{- end }}
              - key: start-dev-openbao.sh
                path: start-dev-openbao.sh
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
