suite: genesis native OpenBao authentication
release:
  name: genesis
  namespace: genesis
templates:
- deployment.yaml
values:
- published-values.yaml
- native_values.yaml
tests:
- it: projects an audience-scoped JWT only into the application without AppRole credentials
  set: {}
  asserts:
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
  - notExists:
      path: spec.template.spec.initContainers
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_AUTH_METHOD
        value: kubernetes
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_KUBERNETES_ROLE
        value: genesis-runtime
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_KUBERNETES_AUTH_MOUNT
        value: kubernetes
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_KUBERNETES_TOKEN_PATH
        value: /var/run/secrets/openbao-native/token
  - equal:
      path: spec.template.spec.volumes
      value:
      - name: openbao-native-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: openbao
              expirationSeconds: 3600
          defaultMode: 256
  - equal:
      path: spec.template.spec.containers[0].volumeMounts
      value:
      - name: openbao-native-token
        mountPath: /var/run/secrets/openbao-native
        readOnly: true
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "GENESIS_OPENBAO_ROLE_ID")]
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "GENESIS_OPENBAO_SECRET_ID")]
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "GENESIS_OPENBAO_WRAPPED_TOKEN")]
- it: uses the requested token filename directory audience and lifetime
  set:
    openbao.kubernetes.tokenPath: /run/native-jwt/projected.jwt
    openbao.kubernetes.authMount: teams/cluster-1
    openbao.kubernetes.audience: openbao-native
    openbao.kubernetes.tokenExpirationSeconds: 600
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_KUBERNETES_AUTH_MOUNT
        value: teams/cluster-1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_KUBERNETES_TOKEN_PATH
        value: /run/native-jwt/projected.jwt
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: openbao-native-token
        mountPath: /run/native-jwt
        readOnly: true
  - equal:
      path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken
      value:
        path: projected.jwt
        audience: openbao-native
        expirationSeconds: 600
- it: allows native authentication alongside an existing TLS Secret
  set:
    tls.existingSecret: native-tls
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: tls-bundle
        secret:
          secretName: native-tls
          items:
          - key: bundle.pem
            path: bundle.pem
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: openbao-native-token
        mountPath: /var/run/secrets/openbao-native
        readOnly: true
  - notExists:
      path: spec.template.spec.initContainers
- it: preserves the external CSI TLS escape hatch without native PKI automation
  set:
    tls.pemBundlePath: /run/external-tls/bundle.pem
    extraVolumes:
    - &id001
      name: external-tls
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: native-tls
    extraVolumeMounts:
    - name: external-tls
      mountPath: /run/external-tls
      readOnly: true
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content: *id001
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: external-tls
        mountPath: /run/external-tls
        readOnly: true
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_TLS_PEM_BUNDLE
        value: /run/external-tls/bundle.pem
  - notExists:
      path: spec.template.spec.initContainers
- it: renders explicit AppRole authentication without a native JWT volume
  set:
    openbao.authMethod: approle
    openbao.roleId.value: fixture-role
    openbao.secretId.existingSecret: fixture-credentials
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_AUTH_METHOD
        value: approle
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_ROLE_ID
        value: fixture-role
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_SECRET_ID
        valueFrom:
          secretKeyRef:
            name: fixture-credentials
            key: secret_id
  - notExists:
      path: spec.template.spec.volumes
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts
- it: preserves legacy auto socket mode without new auth flags or a projected JWT
  set:
    openbao.authMethod: auto
    openbao.url: /var/run/secrets/openbao/agent.sock
  asserts:
  - notExists:
      path: spec.template.spec.containers[0].env[?(@.name == "GENESIS_OPENBAO_AUTH_METHOD")]
  - notExists:
      path: spec.template.spec.volumes
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts
- it: requires a native OpenBao role
  set:
    openbao.kubernetes.role: ''
  asserts:
  - failedTemplate:
      errorPattern: openbao.kubernetes.role must be set
- it: rejects a whitespace-only native OpenBao role
  set:
    openbao.kubernetes.role: '   '
  asserts:
  - failedTemplate:
      errorPattern: openbao.kubernetes.role must be set
- it: rejects socket in native mode
  set:
    openbao.url: /run/openbao/agent.sock
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects Unix URL in native mode
  set:
    openbao.url: unix:///run/openbao/agent.sock
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects non-origin path in native mode
  set:
    openbao.url: https://openbao.example.com/v1
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects query in native mode
  set:
    openbao.url: https://openbao.example.com?x=1
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects credentials in native mode
  set:
    openbao.url: https://user:pass@openbao.example.com
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects empty hostname in native mode
  set:
    openbao.url: https://:8200
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin
- it: rejects an Agent alongside native auth
  set:
    openbao.agent.enabled: true
  asserts:
  - failedTemplate:
      errorPattern: openbao.agent.enabled requires openbao.authMethod=auto
- it: rejects an Agent alongside explicit AppRole auth
  set:
    openbao.authMethod: approle
    openbao.agent.enabled: true
  asserts:
  - failedTemplate:
      errorPattern: openbao.agent.enabled requires openbao.authMethod=auto
- it: rejects explicit AppRole auth over a socket
  set:
    openbao.authMethod: approle
    openbao.url: /run/openbao/agent.sock
  asserts:
  - failedTemplate:
      errorPattern: approle requires a TCP OpenBao URL
- it: requires automatic service-account token mounting to be disabled
  set:
    serviceAccount.automount: true
  asserts:
  - failedTemplate:
      errorPattern: serviceAccount.automount must be false
- it: rejects native mode with roleId.value
  set:
    openbao.roleId.value: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects native mode with roleId.existingSecret
  set:
    openbao.roleId.existingSecret: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects native mode with secretId.value
  set:
    openbao.secretId.value: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects native mode with secretId.existingSecret
  set:
    openbao.secretId.existingSecret: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects native mode with wrappedToken.value
  set:
    openbao.wrappedToken.value: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects native mode with wrappedToken.existingSecret
  set:
    openbao.wrappedToken.existingSecret: fixture-credential
  asserts:
  - failedTemplate:
      errorPattern: roleId/secretId/wrappedToken must not be set
- it: rejects OpenBao ESO credentials
  set:
    externalSecret.enabled: true
    externalSecret.store: openbao
    openbao.externalSecret.remoteKey: approle
  asserts:
  - failedTemplate:
      errorPattern: openbao.externalSecret.remoteKey must not be set
- it: rejects dormant OpenBao ESO credential configuration
  set:
    openbao.externalSecret.remoteKey: approle
  asserts:
  - failedTemplate:
      errorPattern: openbao.externalSecret.remoteKey must not be set
- it: rejects token path relative/token
  set:
    openbao.kubernetes.tokenPath: relative/token
  asserts:
  - failedTemplate:
      errorPattern: tokenPath must be a normalized absolute file path inside a dedicated directory
- it: rejects token path /token
  set:
    openbao.kubernetes.tokenPath: /token
  asserts:
  - failedTemplate:
      errorPattern: tokenPath must be a normalized absolute file path inside a dedicated directory
- it: rejects token path /run/native/../token
  set:
    openbao.kubernetes.tokenPath: /run/native/../token
  asserts:
  - failedTemplate:
      errorPattern: tokenPath must be a normalized absolute file path inside a dedicated directory
- it: rejects token path /run/native/token/
  set:
    openbao.kubernetes.tokenPath: /run/native/token/
  asserts:
  - failedTemplate:
      errorPattern: tokenPath must be a normalized absolute file path inside a dedicated directory
- it: rejects auth mount /v1/auth/kubernetes
  set:
    openbao.kubernetes.authMount: /v1/auth/kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects auth mount ../kubernetes
  set:
    openbao.kubernetes.authMount: ../kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects auth mount team/../kubernetes
  set:
    openbao.kubernetes.authMount: team/../kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects auth mount team//kubernetes
  set:
    openbao.kubernetes.authMount: team//kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects auth mount kubernetes?x=1
  set:
    openbao.kubernetes.authMount: kubernetes?x=1
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects an empty audience
  set:
    openbao.kubernetes.audience: ' '
  asserts:
  - failedTemplate:
      errorPattern: audience must not be empty
- it: rejects token lifetimes below the Kubernetes minimum
  set:
    openbao.kubernetes.tokenExpirationSeconds: 599
  asserts:
  - failedTemplate:
      errorPattern: 'tokenExpirationSeconds: Must be greater than or equal to 600'
- it: rejects token lifetimes above the chart bound
  set:
    openbao.kubernetes.tokenExpirationSeconds: 86401
  asserts:
  - failedTemplate:
      errorPattern: 'tokenExpirationSeconds: Must be less than or equal to 86400'
- it: rejects unknown auth methods
  set:
    openbao.authMethod: unknown
  asserts:
  - failedTemplate:
      errorPattern: 'authMethod: .*must be one of'
- it: rejects reuse of the projected token volume name
  set:
    extraVolumes:
    - name: openbao-native-token
      emptyDir: {}
  asserts:
  - failedTemplate:
      errorPattern: extraVolumes must not use reserved volume names
- it: rejects remounting the reserved projected token volume
  set:
    extraVolumeMounts:
    - name: openbao-native-token
      mountPath: /run/other-token
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts must not use reserved volume names
- it: rejects overlapping extra mount /var/run/secrets/openbao-native
  set:
    extraVolumes:
    - name: collision
      emptyDir: {}
    extraVolumeMounts:
    - name: collision
      mountPath: /var/run/secrets/openbao-native
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts must not overlap native OpenBao token
- it: rejects overlapping extra mount /var/run/secrets
  set:
    extraVolumes:
    - name: collision
      emptyDir: {}
    extraVolumeMounts:
    - name: collision
      mountPath: /var/run/secrets
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts must not overlap native OpenBao token
- it: rejects overlapping extra mount /var/run/secrets/openbao-native/child
  set:
    extraVolumes:
    - name: collision
      emptyDir: {}
    extraVolumeMounts:
    - name: collision
      mountPath: /var/run/secrets/openbao-native/child
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts must not overlap native OpenBao token
- it: rejects overlapping extra mount /var/run/secrets/openbao-native/../openbao-native
  set:
    extraVolumes:
    - name: collision
      emptyDir: {}
    extraVolumeMounts:
    - name: collision
      mountPath: /var/run/secrets/openbao-native/../openbao-native
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts must not overlap native OpenBao token
- it: rejects token mounts hiding the TLS bundle
  set:
    openbao.kubernetes.tokenPath: /var/run/genesis/tls/token
  asserts:
  - failedTemplate:
      errorPattern: native OpenBao token and application mount directories must not overlap
- it: rejects token mounts above a legacy TLS directory
  set:
    openbao.kubernetes.tokenPath: /var/run/genesis/token
    tls.existingSecret: legacy-tls
  asserts:
  - failedTemplate:
      errorPattern: native OpenBao token and application mount directories must not overlap
- it: rejects token mounts hiding the application listener socket
  set:
    config.socketPath: /var/run/secrets/openbao-native/app.sock
    service.enabled: false
  asserts:
  - failedTemplate:
      errorPattern: native OpenBao token and application mount directories must not overlap
- it: rejects extraEnv override of OPENBAO_URL
  set:
    extraEnv:
    - name: GENESIS_OPENBAO_URL
      value: override
  asserts:
  - failedTemplate:
      errorPattern: extraEnv must not override chart-managed OpenBao authentication or credentials
- it: rejects extraEnv override of OPENBAO_AUTH_METHOD
  set:
    extraEnv:
    - name: GENESIS_OPENBAO_AUTH_METHOD
      value: override
  asserts:
  - failedTemplate:
      errorPattern: extraEnv must not override chart-managed OpenBao authentication or credentials
- it: rejects extraEnv override of OPENBAO_KUBERNETES_TOKEN_PATH
  set:
    extraEnv:
    - name: GENESIS_OPENBAO_KUBERNETES_TOKEN_PATH
      value: override
  asserts:
  - failedTemplate:
      errorPattern: extraEnv must not override chart-managed OpenBao authentication or credentials
- it: rejects extraEnv override of OPENBAO_ROLE_ID
  set:
    extraEnv:
    - name: GENESIS_OPENBAO_ROLE_ID
      value: override
  asserts:
  - failedTemplate:
      errorPattern: extraEnv must not override chart-managed OpenBao authentication or credentials
- it: rejects relative extra mounts that can shadow the native JWT
  set:
    extraVolumes:
    - name: shadow
      emptyDir: {}
    extraVolumeMounts:
    - name: shadow
      mountPath: var/run/secrets/openbao-native
  asserts:
  - failedTemplate:
      errorPattern: extraVolumeMounts mountPath must be absolute
- it: rejects chart-owned OpenBao URL overrides in explicit AppRole mode
  set:
    openbao.authMethod: approle
    openbao.roleId.value: fixture-role
    openbao.secretId.value: fixture-secret
    extraEnv:
    - name: GENESIS_OPENBAO_URL
      value: /run/agent.sock
  asserts:
  - failedTemplate:
      errorPattern: extraEnv must not override chart-managed OpenBao authentication or credentials
- it: rejects auth mount auth/kubernetes
  set:
    openbao.kubernetes.authMount: auth/kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects auth mount v1/auth/kubernetes
  set:
    openbao.kubernetes.authMount: v1/auth/kubernetes
  asserts:
  - failedTemplate:
      errorPattern: authMount must be a relative OpenBao auth mount
- it: rejects native origins with out-of-range ports
  set:
    openbao.url: https://openbao.example.com:99999
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin port must be within 0-65535
- it: rejects native IPv6 origins with out-of-range ports
  set:
    openbao.url: https://[2001:db8::1]:65536/
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin port must be within 0-65535
- it: rejects native origin ports too large for integer conversion
  set:
    openbao.url: https://openbao.example.com:99999999999999999999
  asserts:
  - failedTemplate:
      errorPattern: TCP OpenBao URL origin port must be within 0-65535
- it: accepts the highest native origin port and a trailing slash
  set:
    openbao.url: https://openbao.example.com:65535/
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_URL
        value: https://openbao.example.com:65535/
- it: accepts the lowest native origin port over HTTP
  set:
    openbao.url: http://openbao.example.com:0
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_URL
        value: http://openbao.example.com:0
- it: accepts native IPv6 origins without an explicit port
  set:
    openbao.url: https://[2001:db8::1]
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_URL
        value: https://[2001:db8::1]
- it: accepts native IPv6 origins with the highest port and a trailing slash
  set:
    openbao.url: http://[2001:db8::1]:65535/
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GENESIS_OPENBAO_URL
        value: http://[2001:db8::1]:65535/
- it: rejects projected token filenames beginning with two dots
  set:
    openbao.kubernetes.tokenPath: /run/native/..jwt
  asserts:
  - failedTemplate:
      errorPattern: tokenPath filename must not start with
