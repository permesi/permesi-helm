---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/permesi/permesi
  tag: 0.6.1
  # Required sha256:<64 hex> digest; it replaces the tag in the image reference
  # (repository@digest). Release bumps set it; update tag and digest together.
  digest: "sha256:fc7be9b14ea928d3454060a9110d6632855cc90e4f8ca678b1a48194fbbbfb06"
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  port: 8080
  socketPath: ""
  logLevel: info

database:
  dsn:
    value: postgres://postgres@postgres-permesi:5432/permesi?sslmode=disable
    existingSecret: ""
    secretKey: dsn
    externalSecret:
      remoteKey: ""
      remoteProperty: ""

tls:
  pemBundlePath: /var/run/permesi/tls/bundle.pem
  existingSecret: ""
  secretKey: bundle.pem
  externalSecret:
    remoteKey: ""
    remoteProperty: ""

# Admission token claims. The approved Genesis signing keys and the minimum
# accepted version come from the core OpenBao authority record
# (secret/permesi/admission-authority), not from Genesis or a CA bundle.
admission:
  issuer: ""
  audience: ""

openbao:
  url: /var/run/secrets/openbao/agent.sock
  # auto: a Unix socket uses the OpenBao Agent, an http(s) URL uses AppRole.
  # kubernetes: native Kubernetes auth with a projected service-account token.
  authMethod: auto
  kubernetes:
    authMount: kubernetes
    role: ""
    tokenPath: /var/run/secrets/openbao-native/token
    audience: openbao
    tokenExpirationSeconds: 3600
  externalSecret:
    remoteKey: ""
    roleIdProperty: ""
    secretIdProperty: ""
  roleId:
    value: ""
    existingSecret: ""
    secretKey: role_id
  secretId:
    value: ""
    existingSecret: ""
    secretKey: secret_id
  wrappedToken:
    value: ""
    existingSecret: ""
    secretKey: wrapped_token
  kvMount: secret/permesi
  kvPath: config
  transitMount: transit/permesi
  # Managed OpenBao Agent sidecar (native sidecar, Kubernetes >= 1.29).
  agent:
    enabled: false
    # HTTP(S) origin of OpenBao the agent authenticates against. Independent of
    # openbao.url (the Unix socket the application connects to).
    address: ""
    image:
      repository: docker.io/openbao/openbao
      tag: "2.7.3"
      # OpenBao workloads require a pinned sha256:<64 hex> digest; it replaces
      # the tag in the image reference. Update both together.
      digest: "sha256:b9418c63e2185157d8ee8689a8a93265d5aadad677d6320156172bd42ad3b10b"
      pullPolicy: IfNotPresent
    auth:
      mount: kubernetes
      role: ""
      audience: openbao
      tokenExpirationSeconds: 3600
    ca:
      existingConfigMap: ""
      key: ca.crt
    pki:
      mount: pki-int
      role: ""
      commonName: ""
      dnsNames: []
      ttl: 24h
      renewalThreshold: 0.8
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    startupProbe:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 120

auth:
  frontendBaseUrl: https://permesi.dev
  corsAllowedOrigins: ""
  emailTokenTtlSeconds: 1800
  emailResendCooldownSeconds: 60
  sessionTtlSeconds: 604800
  emailOutboxPollSeconds: 5
  emailOutboxBatchSize: 10
  emailOutboxMaxAttempts: 5
  emailOutboxBackoffBaseSeconds: 5
  emailOutboxBackoffMaxSeconds: 300
  opaqueServerId: api.permesi.dev
  opaqueLoginTtlSeconds: 300
  platformAdminTtlSeconds: 43200
  platformRecentAuthSeconds: 3600

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: permesi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  readiness:
    enabled: true
    path: /ready
    scheme: HTTPS
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    path: /live
    scheme: HTTPS
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 60
revisionHistoryLimit: 5

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

externalSecret:
  enabled: false
  store: ""
  storeKind: ClusterSecretStore
  refreshInterval: 1h
