qualificationObservations: false
# permesi-quickstart: disposable development dependencies.
#
# WARNING: development-only. In-memory dev OpenBao, ephemeral PostgreSQL, and a
# bootstrap-only credential Secret. Losing OpenBao while PostgreSQL is retained is
# NOT recoverable by regenerating the OPAQUE seed. Never deploy to production.
#
# acknowledgeDevelopment must be explicitly set to true before any resource is
# rendered. This is a loud gate, not a production-safety mechanism.
acknowledgeDevelopment: false

nameOverride: ""
fullnameOverride: ""

rbac:
  # false: a cluster administrator must pregrant tokenreviews.create to ONLY
  # system:serviceaccount:<namespace>:<fullname>-openbao (not application/bootstrap
  # accounts). The installer skips cluster-RBAC creation preflight in this mode.
  # Namespace-scoped credential Job RBAC is unaffected.
  createTokenReviewBinding: true

bootstrap:
  # Operator-provisioned credentials Secret. When empty, the credentials Job
  # creates "<fullname>-bootstrap-credentials" once and never regenerates it.
  # Required keys: postgres-admin-password, openbao-root-token,
  # openbao-permesi-password, openbao-genesis-password.
  credentialsSecret: ""
  # Owner passwords remain stable for canonical schema bootstrap. Separate
  # openbao_{permesi,genesis}_manager logins initially share these passwords, then
  # OpenBao immediately rotates them; manager credentials live only inside OpenBao.
  # Existing-Secret passwords may include ':' and '\', but not CR/LF.

  # Canonical permesi db/sql include tree. Set exactly one source.
  schema:
    # Pinned archive fetched (and sha256-verified) by the schema-acquisition
    # init container. Updated with the release fixture.
    sourceUrl: "https://github.com/permesi/permesi/archive/7ee7623e7e41be85f3ab7476ceca3012fe570cec.tar.gz"
    sha256: "a5ebada0e8b5c8734257907af367501df9c8f91b42576a8bb4ef126aee041ea3"
    # Nonsecret metadata recorded on the bootstrap Job.
    revision: "7ee7623e7e41be85f3ab7476ceca3012fe570cec"
    # Pre-packaged SQL ConfigMaps instead (air-gapped / install.sh --app-source).
    # Every *.sql key of every listed ConfigMap is copied into one flat tree.
    existingConfigMaps: []

  kubernetes:
    host: "https://kubernetes.default.svc"

  # Bound to the actual application ServiceAccounts in this namespace. Empty
  # names follow each component's release/fullname convention (umbrella-safe).
  # Override when components use serviceAccount.name or fullnameOverride.
  kubernetesRoles:
    audience: "openbao"
    ttl: "1h"
    maxTtl: "4h"
    permesi:
      serviceAccount: ""
    genesis:
      serviceAccount: ""

  pki:
    rootCommonName: "Permesi Quickstart Root CA"
    intermediateCommonName: "Permesi Quickstart Intermediate CA"
    # Listener leaf TTLs (lower for rotation tests).
    ttl: "24h"
    maxTtl: "72h"

  # Create the OIDC signing key and attach the permesi-oidc policy.
  oidcSigning:
    enabled: true

  # Actual application Service names (per-service PKI roles allow exactly
  # <name>, <name>.<ns>, <name>.<ns>.svc, <name>.<ns>.svc.cluster.local) plus
  # explicit browser-facing hostnames. Empty names follow the corresponding
  # component's release/fullname convention; override for fullnameOverride.
  services:
    permesi:
      serviceName: ""
      browserDnsNames: ["api.localhost"]
    genesis:
      serviceName: ""
      browserDnsNames: ["genesis.localhost"]

# Image pins must equal scripts/quickstart/openbao-images.json (release check).
postgresql:
  image:
    repository: "docker.io/library/postgres"
    tag: "19.0"
    digest: "sha256:d2c8a7d3d224a9c0335bf9f69ae6ad0b9aa7d88c4b64bab89f0f261332f6d4de"
    pullPolicy: IfNotPresent
  service:
    # Default "<fullname>-postgresql".
    name: ""
    port: 5432
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

openbao:
  image:
    repository: "docker.io/openbao/openbao"
    tag: "2.7.3"
    digest: "sha256:b9418c63e2185157d8ee8689a8a93265d5aadad677d6320156172bd42ad3b10b"
    pullPolicy: IfNotPresent
  service:
    # Default "<fullname>-openbao".
    name: ""
    port: 8200
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

credentialsJob:
  ttlSecondsAfterFinished: 3600

bootstrapJob:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 900

nodeSelector: {}
tolerations: []
