suite: genesis validation failures
release:
  name: my-release
templates:
  - deployment.yaml
values:
  - published-values.yaml
tests:
  - it: fails when OpenBao ESO is active and roleId/secretId existingSecret names conflict
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
      openbao.roleId.existingSecret: openbao-a
      openbao.secretId.existingSecret: openbao-b
    asserts:
      - failedTemplate:
          errorPattern: "when OpenBao ESO is enabled"

  - it: fails when externalSecret is enabled with a remoteKey but no store
    set:
      externalSecret.enabled: true
      database.dsn.externalSecret.remoteKey: db/creds
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.store must be set"

  - it: fails when autoscaling minReplicas exceeds maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 8
      autoscaling.maxReplicas: 3
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling.minReplicas must not exceed"

  - it: rejects a stale vault values block
    set:
      vault.url: https://vault.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "vault values block was renamed to openbao"

  - it: rejects the removed secretsProvider switch
    set:
      secretsProvider: openbao
    asserts:
      - failedTemplate:
          errorPattern: "secretsProvider was removed"

  - it: renders the admission signing version
    set:
      admissionSigningVersion: 7
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_ADMISSION_SIGNING_VERSION
            value: "7"

  - it: rejects OpenBao and admission settings passed through extraEnv
    set:
      extraEnv:
        - name: GENESIS_ADMISSION_SIGNING_VERSION
          value: "9"
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"

  - it: renders only OpenBao environment names
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_URL
            value: /var/run/secrets/openbao/agent.sock
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_VAULT_URL
          any: true

  - it: rejects PERMESI_OPENBAO_URL in extraEnv
    set:
      extraEnv:
        - name: PERMESI_OPENBAO_URL
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects GENESIS_OPENBAO_ROLE_ID in extraEnv
    set:
      extraEnv:
        - name: GENESIS_OPENBAO_ROLE_ID
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects GENESIS_ADMISSION_SIGNING_VERSION in extraEnv
    set:
      extraEnv:
        - name: GENESIS_ADMISSION_SIGNING_VERSION
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects GENESIS_TRANSIT_MOUNT in extraEnv
    set:
      extraEnv:
        - name: GENESIS_TRANSIT_MOUNT
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"
