{{- include "permesi.validateValues" . }}
{{- $socketMode := ne (default "" .Values.config.socketPath) "" -}}
{{- $vaultEso := and .Values.externalSecret.enabled (ne (dig "externalSecret" "remoteKey" "" .Values.vault) "") -}}
{{- $admissionCaSecret := include "permesi.admissionCaSecretName" . -}}
{{- $tlsSecret := include "permesi.tlsSecretName" . -}}
{{- $agentEnabled := .Values.vault.agent.enabled -}}
{{- $agentManagesTls := and $agentEnabled (not $socketMode) -}}
{{- $agentManagesCa := and $agentEnabled .Values.vault.agent.paserkCa.enabled -}}
{{- $admissionCaPath := default "" .Values.admission.paserkCaPath -}}
{{- if and (eq $admissionCaPath "") (or (ne $admissionCaSecret "") $agentManagesCa) -}}
{{- $admissionCaPath = printf "%s/%s" .Values.admission.paserkCa.mountPath .Values.admission.paserkCa.fileName -}}
{{- end -}}
{{- $agentSocketDir := include "permesi.agentSocketDir" . -}}
{{- $agentTlsDir := include "permesi.agentTlsDir" . -}}
{{- $agentCaDir := include "permesi.agentAdmissionCaDir" . -}}
{{- $mountTls := or $tlsSecret $agentManagesTls -}}
{{- $mountCa := or $admissionCaSecret $agentManagesCa -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "permesi.fullname" . }}
  labels:
    {{- include "permesi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "permesi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "permesi.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations $agentEnabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $agentEnabled }}
        checksum/vault-agent-config: {{ include "permesi.agentConfigChecksum" . }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "permesi.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $agentEnabled }}
      initContainers:
        - name: vault-agent
          image: {{ include "permesi.image" .Values.vault.agent.image | quote }}
          imagePullPolicy: {{ .Values.vault.agent.image.pullPolicy }}
          command: ["/bin/vault"]
          args:
            - agent
            - -config=/vault/config/agent.hcl
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config
              readOnly: true
            {{- if .Values.vault.agent.ca.existingConfigMap }}
            - name: vault-agent-ca
              mountPath: /vault/ca
              readOnly: true
            {{- end }}
            - name: vault-agent-token
              mountPath: /var/run/secrets/vault-token
              readOnly: true
            - name: vault-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
            - name: vault-agent-scratch
              mountPath: /tmp
            {{- if $agentManagesTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
            {{- end }}
            {{- if $agentManagesCa }}
            - name: admission-paserk-ca
              mountPath: {{ $agentCaDir | quote }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '{{ include "permesi.agentProbeCommand" . | trim }}'
            periodSeconds: {{ .Values.vault.agent.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vault.agent.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.vault.agent.startupProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.vault.agent.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: permesi
          image: {{ include "permesi.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if not $socketMode }}
          ports:
            - name: https
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: PERMESI_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if $socketMode }}
            - name: PERMESI_SOCKET_PATH
              value: {{ .Values.config.socketPath | quote }}
            {{- else }}
            - name: PERMESI_PORT
              value: {{ .Values.config.port | quote }}
            - name: PERMESI_TLS_PEM_BUNDLE
              value: {{ .Values.tls.pemBundlePath | quote }}
            {{- end }}

            - name: PERMESI_DSN
              {{- if include "permesi.dbSecretName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "permesi.dbSecretName" . | quote }}
                  key: {{ .Values.database.dsn.secretKey | quote }}
              {{- else }}
              value: {{ .Values.database.dsn.value | quote }}
              {{- end }}

            - name: PERMESI_ADMISSION_PASERK_URL
              value: {{ .Values.admission.paserkUrl | quote }}
            {{- with .Values.admission.issuer }}
            - name: PERMESI_ADMISSION_ISS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.admission.audience }}
            - name: PERMESI_ADMISSION_AUD
              value: {{ . | quote }}
            {{- end }}
            {{- if $admissionCaPath }}
            - name: PERMESI_ADMISSION_PASERK_CA_PATH
              value: {{ $admissionCaPath | quote }}
            {{- end }}

            - name: PERMESI_VAULT_URL
              value: {{ .Values.vault.url | quote }}
            {{- if $vaultEso }}
            - name: PERMESI_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "permesi.vaultSecretName" . | quote }}
                  key: {{ .Values.vault.roleId.secretKey | quote }}
            - name: PERMESI_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "permesi.vaultSecretName" . | quote }}
                  key: {{ .Values.vault.secretId.secretKey | quote }}
            {{- else }}
            {{- if .Values.vault.roleId.existingSecret }}
            - name: PERMESI_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.roleId.existingSecret | quote }}
                  key: {{ .Values.vault.roleId.secretKey | quote }}
            {{- else if .Values.vault.roleId.value }}
            - name: PERMESI_VAULT_ROLE_ID
              value: {{ .Values.vault.roleId.value | quote }}
            {{- end }}
            {{- if .Values.vault.secretId.existingSecret }}
            - name: PERMESI_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.secretId.existingSecret | quote }}
                  key: {{ .Values.vault.secretId.secretKey | quote }}
            {{- else if .Values.vault.secretId.value }}
            - name: PERMESI_VAULT_SECRET_ID
              value: {{ .Values.vault.secretId.value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.vault.wrappedToken.existingSecret }}
            - name: PERMESI_VAULT_WRAPPED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.wrappedToken.existingSecret | quote }}
                  key: {{ .Values.vault.wrappedToken.secretKey | quote }}
            {{- else if .Values.vault.wrappedToken.value }}
            - name: PERMESI_VAULT_WRAPPED_TOKEN
              value: {{ .Values.vault.wrappedToken.value | quote }}
            {{- end }}
            - name: PERMESI_VAULT_KV_MOUNT
              value: {{ .Values.vault.kvMount | quote }}
            - name: PERMESI_VAULT_KV_PATH
              value: {{ .Values.vault.kvPath | quote }}
            - name: PERMESI_VAULT_TRANSIT_MOUNT
              value: {{ .Values.vault.transitMount | quote }}

            - name: PERMESI_FRONTEND_BASE_URL
              value: {{ .Values.auth.frontendBaseUrl | quote }}
            {{- if .Values.auth.corsAllowedOrigins }}
            - name: PERMESI_CORS_ALLOWED_ORIGINS
              value: {{ .Values.auth.corsAllowedOrigins | quote }}
            {{- end }}
            - name: PERMESI_EMAIL_TOKEN_TTL_SECONDS
              value: {{ .Values.auth.emailTokenTtlSeconds | quote }}
            - name: PERMESI_EMAIL_RESEND_COOLDOWN_SECONDS
              value: {{ .Values.auth.emailResendCooldownSeconds | quote }}
            - name: PERMESI_SESSION_TTL_SECONDS
              value: {{ .Values.auth.sessionTtlSeconds | quote }}
            - name: PERMESI_EMAIL_OUTBOX_POLL_SECONDS
              value: {{ .Values.auth.emailOutboxPollSeconds | quote }}
            - name: PERMESI_EMAIL_OUTBOX_BATCH_SIZE
              value: {{ .Values.auth.emailOutboxBatchSize | quote }}
            - name: PERMESI_EMAIL_OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.auth.emailOutboxMaxAttempts | quote }}
            - name: PERMESI_EMAIL_OUTBOX_BACKOFF_BASE_SECONDS
              value: {{ .Values.auth.emailOutboxBackoffBaseSeconds | quote }}
            - name: PERMESI_EMAIL_OUTBOX_BACKOFF_MAX_SECONDS
              value: {{ .Values.auth.emailOutboxBackoffMaxSeconds | quote }}
            - name: PERMESI_OPAQUE_SERVER_ID
              value: {{ .Values.auth.opaqueServerId | quote }}
            - name: PERMESI_OPAQUE_LOGIN_TTL_SECONDS
              value: {{ .Values.auth.opaqueLoginTtlSeconds | quote }}
            - name: PLATFORM_ADMIN_TTL_SECONDS
              value: {{ .Values.auth.platformAdminTtlSeconds | quote }}
            - name: PLATFORM_RECENT_AUTH_SECONDS
              value: {{ .Values.auth.platformRecentAuthSeconds | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $mountTls $mountCa $agentEnabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $mountTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
              readOnly: true
            {{- end }}
            {{- if $mountCa }}
            - name: admission-paserk-ca
              mountPath: {{ if $agentManagesCa }}{{ $agentCaDir | quote }}{{ else }}{{ .Values.admission.paserkCa.mountPath | quote }}{{ end }}
              readOnly: true
            {{- end }}
            {{- if $agentEnabled }}
            - name: vault-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.startup.enabled }}
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: https
              scheme: {{ .Values.probes.readiness.scheme }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: https
              scheme: {{ .Values.probes.liveness.scheme }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or $mountTls $mountCa $agentEnabled .Values.extraVolumes }}
      volumes:
        {{- if $mountTls }}
        - name: tls-bundle
          {{- if $agentManagesTls }}
          emptyDir:
            medium: Memory
          {{- else }}
          secret:
            secretName: {{ $tlsSecret | quote }}
            items:
              - key: {{ .Values.tls.secretKey | quote }}
                path: {{ include "permesi.pathBase" .Values.tls.pemBundlePath | quote }}
          {{- end }}
        {{- end }}
        {{- if $mountCa }}
        - name: admission-paserk-ca
          {{- if $agentManagesCa }}
          emptyDir:
            medium: Memory
          {{- else }}
          secret:
            secretName: {{ $admissionCaSecret | quote }}
            items:
              - key: {{ .Values.admission.paserkCa.secretKey | quote }}
                path: {{ .Values.admission.paserkCa.fileName | quote }}
          {{- end }}
        {{- end }}
        {{- if $agentEnabled }}
        - name: vault-agent-socket
          emptyDir:
            medium: Memory
        - name: vault-agent-config
          configMap:
            name: {{ include "permesi.agentConfigName" . | quote }}
        - name: vault-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vault.agent.auth.audience | quote }}
                  expirationSeconds: {{ .Values.vault.agent.auth.tokenExpirationSeconds }}
            defaultMode: 0400
        {{- if .Values.vault.agent.ca.existingConfigMap }}
        - name: vault-agent-ca
          configMap:
            name: {{ .Values.vault.agent.ca.existingConfigMap | quote }}
        {{- end }}
        - name: vault-agent-scratch
          emptyDir:
            medium: Memory
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
