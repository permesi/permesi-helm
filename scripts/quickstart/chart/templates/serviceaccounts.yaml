{{- include "quickstart.validateValues" . -}}
{{- $fullname := include "quickstart.fullname" . -}}
{{- range $sa := list "vault" "credentials" "bootstrap" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $fullname $sa }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "quickstart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $sa }}
# Only Vault (TokenReview reviewer) and the credentials Job (Secret create)
# call the Kubernetes API; the bootstrap Job never does.
automountServiceAccountToken: {{ ne $sa "bootstrap" }}
{{- end }}
