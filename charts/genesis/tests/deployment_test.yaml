suite: genesis deployment defaults
release:
  name: my-release
templates:
  - deployment.yaml
values:
  - published-values.yaml
tests:
  - it: renders default termination grace of 60 seconds
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: renders pod-level seccomp RuntimeDefault
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders pod-level automountServiceAccountToken
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: leaves the transport opt-outs off by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_DB_ALLOW_UNVERIFIED_TLS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_ALLOW_INSECURE_HTTP
          any: true

  - it: passes the transport opt-outs only when a development cluster asks for them
    set:
      database.allowUnverifiedTls: true
      openbao.allowInsecureHttp: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_DB_ALLOW_UNVERIFIED_TLS
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_ALLOW_INSECURE_HTTP
            value: "true"

  - it: accepts only booleans for the transport opt-outs
    set:
      database.allowUnverifiedTls: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "allowUnverifiedTls"

  - it: keeps DSN inline by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_DSN
            value: "postgres://postgres@postgres-genesis:5432/genesis?sslmode=verify-full"

  - it: does not mount a TLS volume by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes

  - it: renders with ESO disabled and tls.externalSecret null
    set:
      tls.externalSecret: null
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: sets replicas when autoscaling is disabled
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: socket mode suppresses port and emits socket path env
    set:
      config.socketPath: /run/genesis.sock
      service.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_SOCKET_PATH
            value: /run/genesis.sock
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_PORT

  - it: omits replicas when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
