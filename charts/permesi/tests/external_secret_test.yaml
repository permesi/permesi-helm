suite: permesi ExternalSecret
release:
  name: permesi
  namespace: permesi
templates:
  - external-secret.yaml
tests:
  - it: generates default target names for each source
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.externalSecret.remoteKey: db-remote
      tls.externalSecret.remoteKey: tls-remote
      openbao.externalSecret.remoteKey: openbao-remote
    asserts:
      - equal:
          path: spec.target.name
          value: permesi-db
        documentSelector:
          path: metadata.name
          value: permesi-db
      - equal:
          path: spec.target.name
          value: permesi-tls
        documentSelector:
          path: metadata.name
          value: permesi-tls
      - equal:
          path: spec.target.name
          value: permesi-openbao
        documentSelector:
          path: metadata.name
          value: permesi-openbao
      - equal:
          path: spec.secretStoreRef.name
          value: openbao-store
        documentSelector:
          path: metadata.name
          value: permesi-db

  - it: writes both role_id and secret_id into the OpenBao secret
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao-remote
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: role_id
          any: true
        documentSelector:
          path: metadata.name
          value: permesi-openbao
      - contains:
          path: spec.data
          content:
            secretKey: secret_id
          any: true
        documentSelector:
          path: metadata.name
          value: permesi-openbao

  - it: uses explicit existingSecret as target when set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.existingSecret: my-db
      database.dsn.externalSecret.remoteKey: db-remote
      openbao.roleId.existingSecret: my-openbao
      openbao.externalSecret.remoteKey: openbao-remote
    asserts:
      - equal:
          path: spec.target.name
          value: my-db
        documentSelector:
          path: metadata.name
          value: permesi-db
      - equal:
          path: spec.target.name
          value: my-openbao
        documentSelector:
          path: metadata.name
          value: permesi-openbao

  - it: uses a lone secretId existingSecret as the OpenBao target
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao-remote
      openbao.secretId.existingSecret: my-openbao
    asserts:
      - equal:
          path: spec.target.name
          value: my-openbao
        documentSelector:
          path: metadata.name
          value: permesi-openbao
