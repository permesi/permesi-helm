suite: permesi OpenBao Agent configmap
release:
  name: permesi
  namespace: permesi
templates:
  - configmap-openbao-agent.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
values:
  - published-values.yaml
tests:
  - it: renders the agent HCL with proxy auth token, no force, no cache
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.role: permesi-runtime
      openbao.agent.pki.commonName: api.permesi.dev
      openbao.agent.pki.dnsNames[0]: api.permesi.dev
    asserts:
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'use_auto_auth_token = true'
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: 'use_auto_auth_token = "?force"?'
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: '(?m)^cache\s*\{'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'mount_path = "auth/kubernetes"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'token_path = "/var/run/secrets/openbao-token/token"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'socket_mode  = "0600"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'socket_user  = "10001"'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'error_on_missing_key = true'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'backup      = false'
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'lease_renewal_threshold = 0.8'
      - matchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '\{\{ \.Data\.Key \}\}\{\{ \.Data\.Cert \}\}\{\{ with secret "pki-int/cert/ca_chain" \}\}\{\{ \.Data\.certificate \}\}\{\{ end \}\}'
      - notMatchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '\{\{ \.Data\.CA \}\}'
      - matchRegex:
          path: data["tls-bundle.tpl"]
          pattern: '"pki-int/issue/permesi-runtime"'
      - notExists:
          path: data["paserk-ca.tpl"]
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'pid_file = "/tmp/openbao-agent.pid"'

  - it: omits the inbound PKI template in socket mode
    set:
      config.socketPath: /var/run/permesi/permesi.sock
      service.enabled: false
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
    asserts:
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: 'tls-bundle.tpl'
      - notMatchRegex:
          path: data["agent.hcl"]
          pattern: 'paserk'

  - it: renders an explicit fractional renewal threshold
    set:
      openbao.agent.enabled: true
      openbao.agent.address: https://openbao.example.com:8200
      openbao.agent.auth.role: permesi
      openbao.agent.pki.renewalThreshold: 0.8
    asserts:
      - matchRegex:
          path: data["agent.hcl"]
          pattern: 'lease_renewal_threshold = 0.8'
