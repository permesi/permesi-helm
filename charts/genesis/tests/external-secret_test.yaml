suite: genesis ExternalSecret targets
release:
  name: my-release
templates:
  - external-secret.yaml
values:
  - published-values.yaml
tests:
  - it: targets the generated db name when only remoteKey is set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.externalSecret.remoteKey: db/creds
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-db

  - it: targets the explicit db name over the generated one
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.existingSecret: my-db-secret
      database.dsn.externalSecret.remoteKey: db/creds
    asserts:
      - equal:
          path: spec.target.name
          value: my-db-secret

  - it: targets the generated tls name
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      tls.externalSecret.remoteKey: tls/cert
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-tls

  - it: targets the generated OpenBao name and writes both credentials
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
    asserts:
      - equal:
          path: spec.target.name
          value: my-release-genesis-openbao
      - lengthEqual:
          path: spec.data
          count: 2

  - it: targets the explicit OpenBao name when roleId.existingSecret is set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
      openbao.roleId.existingSecret: my-openbao-secret
    asserts:
      - equal:
          path: spec.target.name
          value: my-openbao-secret

  - it: targets the explicit OpenBao name when only secretId.existingSecret is set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
      openbao.secretId.existingSecret: my-openbao-secret
    asserts:
      - equal:
          path: spec.target.name
          value: my-openbao-secret
      - lengthEqual:
          path: spec.data
          count: 2
