---
name: Auto Release

on:
  workflow_run:
    workflows:
      - Charts CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      head_sha:
        description: Optional tested main SHA to release
        required: false
        type: string

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        ) &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.head_sha || 'main') || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install release validation dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/permesi-stack/Chart.yaml)"

          if [[ -z "${version}" || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid chart version '${version}' in charts/permesi-stack/Chart.yaml" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate chart version alignment
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 scripts/ci/check-chart-versions.py --expected "$VERSION"
          python3 scripts/ci/check-release-fixture.py

      - name: Check whether release exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |-
          set -euo pipefail

          notes=$(cat <<NOTES
          ## permesi-helm ${VERSION}

          Automated release created after successful Charts CI on main.

          ### Charts
          - permesi
          - genesis
          - web
          - permesi-stack

          ### OCI registry
          - oci://ghcr.io/permesi/charts
          NOTES
          )

          gh release create "${TAG}" \
            --target "${{ steps.target.outputs.sha }}" \
            --title "permesi-helm ${VERSION}" \
            --notes "${notes}"

      - name: Trigger Publish Charts workflow
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "Publish Charts" --ref main -f version="${VERSION}"
