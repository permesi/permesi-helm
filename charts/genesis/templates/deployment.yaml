{{- include "genesis.validateValues" . }}
{{- $socketMode := ne (default "" .Values.config.socketPath) "" -}}
{{- $dbSecret := include "genesis.dbSecretName" . -}}
{{- $tlsSecret := include "genesis.tlsSecretName" . -}}
{{- $openbaoRoleIdSecret := include "genesis.openbaoRoleIdSecretName" . -}}
{{- $openbaoSecretIdSecret := include "genesis.openbaoSecretIdSecretName" . -}}
{{- $agentEnabled := .Values.openbao.agent.enabled -}}
{{- $nativeEnabled := eq .Values.openbao.authMethod "kubernetes" -}}
{{- $agentManagesTls := and $agentEnabled (not $socketMode) -}}
{{- $agentSocketDir := include "genesis.agentSocketDir" . -}}
{{- $agentTlsDir := include "genesis.agentTlsDir" . -}}
{{- $mountTls := or $tlsSecret $agentManagesTls -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "genesis.fullname" . }}
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "genesis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genesis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations $agentEnabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $agentEnabled }}
        checksum/openbao-agent-config: {{ include "genesis.agentConfigChecksum" . }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "genesis.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $agentEnabled }}
      initContainers:
        - name: openbao-agent
          image: {{ include "genesis.image" .Values.openbao.agent.image | quote }}
          imagePullPolicy: {{ .Values.openbao.agent.image.pullPolicy }}
          command: ["/usr/bin/bao"]
          args:
            - agent
            - -config=/openbao/config/agent.hcl
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: openbao-agent-config
              mountPath: /openbao/config
              readOnly: true
            {{- if .Values.openbao.agent.ca.existingConfigMap }}
            - name: openbao-agent-ca
              mountPath: /openbao/ca
              readOnly: true
            {{- end }}
            - name: openbao-agent-token
              mountPath: /var/run/secrets/openbao-token
              readOnly: true
            - name: openbao-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
            - name: openbao-agent-scratch
              mountPath: /tmp
            {{- if $agentManagesTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '{{ include "genesis.agentProbeCommand" . | trim }}'
            periodSeconds: {{ .Values.openbao.agent.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.openbao.agent.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.openbao.agent.startupProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.openbao.agent.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: genesis
          image: {{ include "genesis.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if not $socketMode }}
          ports:
            - name: https
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: GENESIS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if $socketMode }}
            - name: GENESIS_SOCKET_PATH
              value: {{ .Values.config.socketPath | quote }}
            {{- else }}
            - name: GENESIS_PORT
              value: {{ .Values.config.port | quote }}
            - name: GENESIS_TLS_PEM_BUNDLE
              value: {{ .Values.tls.pemBundlePath | quote }}
            {{- end }}

            - name: GENESIS_DSN
              {{- if $dbSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: {{ .Values.database.dsn.secretKey | quote }}
              {{- else }}
              value: {{ .Values.database.dsn.value | quote }}
              {{- end }}
            # Always set, so a ConfigMap or Secret in extraEnvFrom cannot turn it on.
            - name: GENESIS_DB_ALLOW_UNVERIFIED_TLS
              # A value missing from an upgrade with --reuse-values renders as false, not empty.
              value: {{ .Values.database.allowUnverifiedTls | default false | quote }}

            - name: GENESIS_OPENBAO_URL
              value: {{ .Values.openbao.url | quote }}
            - name: GENESIS_OPENBAO_ALLOW_INSECURE_HTTP
              value: {{ .Values.openbao.allowInsecureHttp | default false | quote }}
            {{- if ne .Values.openbao.authMethod "auto" }}
            - name: GENESIS_OPENBAO_AUTH_METHOD
              value: {{ .Values.openbao.authMethod | quote }}
            {{- if $nativeEnabled }}
            - name: GENESIS_OPENBAO_KUBERNETES_AUTH_MOUNT
              value: {{ .Values.openbao.kubernetes.authMount | quote }}
            - name: GENESIS_OPENBAO_KUBERNETES_ROLE
              value: {{ .Values.openbao.kubernetes.role | quote }}
            - name: GENESIS_OPENBAO_KUBERNETES_TOKEN_PATH
              value: {{ .Values.openbao.kubernetes.tokenPath | quote }}
            {{- end }}
            {{- end }}
            {{- if $openbaoRoleIdSecret }}
            - name: GENESIS_OPENBAO_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $openbaoRoleIdSecret | quote }}
                  key: {{ .Values.openbao.roleId.secretKey | quote }}
            {{- else if .Values.openbao.roleId.value }}
            - name: GENESIS_OPENBAO_ROLE_ID
              value: {{ .Values.openbao.roleId.value | quote }}
            {{- end }}
            {{- if $openbaoSecretIdSecret }}
            - name: GENESIS_OPENBAO_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $openbaoSecretIdSecret | quote }}
                  key: {{ .Values.openbao.secretId.secretKey | quote }}
            {{- else if .Values.openbao.secretId.value }}
            - name: GENESIS_OPENBAO_SECRET_ID
              value: {{ .Values.openbao.secretId.value | quote }}
            {{- end }}
            {{- if .Values.openbao.wrappedToken.existingSecret }}
            - name: GENESIS_OPENBAO_WRAPPED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.wrappedToken.existingSecret | quote }}
                  key: {{ .Values.openbao.wrappedToken.secretKey | quote }}
            {{- else if .Values.openbao.wrappedToken.value }}
            - name: GENESIS_OPENBAO_WRAPPED_TOKEN
              value: {{ .Values.openbao.wrappedToken.value | quote }}
            {{- end }}
            - name: GENESIS_ADMISSION_SIGNING_VERSION
              value: {{ .Values.admissionSigningVersion | int64 | quote }}
            - name: GENESIS_TRANSIT_MOUNT
              value: {{ .Values.openbao.transitMount | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $mountTls $agentEnabled $nativeEnabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $mountTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
              readOnly: true
            {{- end }}
            {{- if $agentEnabled }}
            - name: openbao-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
              readOnly: true
            {{- end }}
            {{- if $nativeEnabled }}
            - name: openbao-native-token
              mountPath: {{ include "genesis.pathDir" .Values.openbao.kubernetes.tokenPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.startup.enabled }}
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: https
              scheme: {{ .Values.probes.readiness.scheme }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: https
              scheme: {{ .Values.probes.liveness.scheme }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or $mountTls $agentEnabled $nativeEnabled .Values.extraVolumes }}
      volumes:
        {{- if $mountTls }}
        - name: tls-bundle
          {{- if $agentManagesTls }}
          emptyDir:
            medium: Memory
          {{- else }}
          secret:
            secretName: {{ $tlsSecret | quote }}
            items:
              - key: {{ .Values.tls.secretKey | quote }}
                path: {{ include "genesis.pathBase" .Values.tls.pemBundlePath | quote }}
          {{- end }}
        {{- end }}
        {{- if $agentEnabled }}
        - name: openbao-agent-socket
          emptyDir:
            medium: Memory
        - name: openbao-agent-config
          configMap:
            name: {{ include "genesis.agentConfigName" . | quote }}
        - name: openbao-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.openbao.agent.auth.audience | quote }}
                  expirationSeconds: {{ .Values.openbao.agent.auth.tokenExpirationSeconds }}
            defaultMode: 0400
        {{- if .Values.openbao.agent.ca.existingConfigMap }}
        - name: openbao-agent-ca
          configMap:
            name: {{ .Values.openbao.agent.ca.existingConfigMap | quote }}
        {{- end }}
        - name: openbao-agent-scratch
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if $nativeEnabled }}
        - name: openbao-native-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ include "genesis.pathBase" .Values.openbao.kubernetes.tokenPath | quote }}
                  audience: {{ .Values.openbao.kubernetes.audience | quote }}
                  expirationSeconds: {{ .Values.openbao.kubernetes.tokenExpirationSeconds }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
