suite: genesis deployment ESO wiring
release:
  name: my-release
templates:
  - deployment.yaml
values:
  - published-values.yaml
tests:
  - it: consumes explicit existing secrets for DSN, TLS, and OpenBao
    set:
      database.dsn.existingSecret: db-secret
      tls.existingSecret: tls-secret
      openbao.url: https://openbao.example.com:8200
      openbao.roleId.existingSecret: openbao-creds
      openbao.secretId.existingSecret: openbao-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_DSN
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: dsn
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: openbao-creds
                key: role_id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: openbao-creds
                key: secret_id
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: tls-secret

  - it: uses the lone secretId existingSecret for both OpenBao env vars
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao/approle
      openbao.secretId.existingSecret: custom-openbao
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: custom-openbao
                key: role_id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: custom-openbao
                key: secret_id

  - it: consumes ESO-generated secret names when only remoteKeys are set
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      database.dsn.externalSecret.remoteKey: db/creds
      tls.externalSecret.remoteKey: tls/cert
      openbao.externalSecret.remoteKey: openbao/approle
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_DSN
            valueFrom:
              secretKeyRef:
                name: my-release-genesis-db
                key: dsn
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_ROLE_ID
            valueFrom:
              secretKeyRef:
                name: my-release-genesis-openbao
                key: role_id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_OPENBAO_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: my-release-genesis-openbao
                key: secret_id
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-release-genesis-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tls-bundle
