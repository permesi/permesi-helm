---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/permesi/web
  tag: 0.4.3
  # Optional sha256:<64 hex> digest. When set it replaces the tag in the
  # image reference (repository@digest); clear it when changing the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

runtimeConfig:
  # Set to the name of an existing ConfigMap to take over /config.js
  # ownership. When set, the chart does not create or checksum a ConfigMap,
  # and you must restart pods manually (kubectl rollout restart) after
  # changing the external ConfigMap.
  existingConfigMap: ""
  key: config.js
  # Browser-side runtime configuration. These are public URLs and identifiers
  # the browser (WASM) uses to reach the API and Genesis. They must be
  # reachable from the user's browser, not cluster-local DNS names, and must
  # match the provisioned Genesis client and backend OPAQUE server ID.
  # All four values are REQUIRED when the chart manages the ConfigMap unless
  # allowBuildDefaults is true.
  apiBaseUrl: ""
  tokenBaseUrl: ""
  clientId: ""
  opaqueServerId: ""
  # Escape hatch that restores the old behavior of falling back to the
  # image-baked endpoints when the four runtime values above are left blank.
  # NOT recommended for production: it may silently contact the wrong
  # environment.
  allowBuildDefaults: false

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: permesi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  startup:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 20
  readiness:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 5

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
