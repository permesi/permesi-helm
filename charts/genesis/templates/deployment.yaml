{{- include "genesis.validateValues" . }}
{{- $socketMode := ne (default "" .Values.config.socketPath) "" -}}
{{- $dbSecret := include "genesis.dbSecretName" . -}}
{{- $tlsSecret := include "genesis.tlsSecretName" . -}}
{{- $vaultRoleIdSecret := include "genesis.vaultRoleIdSecretName" . -}}
{{- $vaultSecretIdSecret := include "genesis.vaultSecretIdSecretName" . -}}
{{- $agentEnabled := .Values.vault.agent.enabled -}}
{{- $agentManagesTls := and $agentEnabled (not $socketMode) -}}
{{- $agentSocketDir := include "genesis.agentSocketDir" . -}}
{{- $agentTlsDir := include "genesis.agentTlsDir" . -}}
{{- $mountTls := or $tlsSecret $agentManagesTls -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "genesis.fullname" . }}
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "genesis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genesis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations $agentEnabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $agentEnabled }}
        checksum/vault-agent-config: {{ include "genesis.agentConfigChecksum" . }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "genesis.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $agentEnabled }}
      initContainers:
        - name: vault-agent
          image: "{{ .Values.vault.agent.image.repository }}:{{ .Values.vault.agent.image.tag }}"
          imagePullPolicy: {{ .Values.vault.agent.image.pullPolicy }}
          command: ["/bin/vault"]
          args:
            - agent
            - -config=/vault/config/agent.hcl
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config
              readOnly: true
            {{- if .Values.vault.agent.ca.existingConfigMap }}
            - name: vault-agent-ca
              mountPath: /vault/ca
              readOnly: true
            {{- end }}
            - name: vault-agent-token
              mountPath: /var/run/secrets/vault-token
              readOnly: true
            - name: vault-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
            - name: vault-agent-scratch
              mountPath: /tmp
            {{- if $agentManagesTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '{{ include "genesis.agentProbeCommand" . | trim }}'
            periodSeconds: {{ .Values.vault.agent.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.vault.agent.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.vault.agent.startupProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.vault.agent.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: genesis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if not $socketMode }}
          ports:
            - name: https
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: GENESIS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if $socketMode }}
            - name: GENESIS_SOCKET_PATH
              value: {{ .Values.config.socketPath | quote }}
            {{- else }}
            - name: GENESIS_PORT
              value: {{ .Values.config.port | quote }}
            - name: GENESIS_TLS_PEM_BUNDLE
              value: {{ .Values.tls.pemBundlePath | quote }}
            {{- end }}

            - name: GENESIS_DSN
              {{- if $dbSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: {{ .Values.database.dsn.secretKey | quote }}
              {{- else }}
              value: {{ .Values.database.dsn.value | quote }}
              {{- end }}

            - name: GENESIS_VAULT_URL
              value: {{ .Values.vault.url | quote }}
            {{- if $vaultRoleIdSecret }}
            - name: GENESIS_VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultRoleIdSecret | quote }}
                  key: {{ .Values.vault.roleId.secretKey | quote }}
            {{- else if .Values.vault.roleId.value }}
            - name: GENESIS_VAULT_ROLE_ID
              value: {{ .Values.vault.roleId.value | quote }}
            {{- end }}
            {{- if $vaultSecretIdSecret }}
            - name: GENESIS_VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $vaultSecretIdSecret | quote }}
                  key: {{ .Values.vault.secretId.secretKey | quote }}
            {{- else if .Values.vault.secretId.value }}
            - name: GENESIS_VAULT_SECRET_ID
              value: {{ .Values.vault.secretId.value | quote }}
            {{- end }}
            {{- if .Values.vault.wrappedToken.existingSecret }}
            - name: GENESIS_VAULT_WRAPPED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.wrappedToken.existingSecret | quote }}
                  key: {{ .Values.vault.wrappedToken.secretKey | quote }}
            {{- else if .Values.vault.wrappedToken.value }}
            - name: GENESIS_VAULT_WRAPPED_TOKEN
              value: {{ .Values.vault.wrappedToken.value | quote }}
            {{- end }}
            - name: GENESIS_TRANSIT_MOUNT
              value: {{ .Values.vault.transitMount | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $mountTls $agentEnabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $mountTls }}
            - name: tls-bundle
              mountPath: {{ $agentTlsDir | quote }}
              readOnly: true
            {{- end }}
            {{- if $agentEnabled }}
            - name: vault-agent-socket
              mountPath: {{ $agentSocketDir | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.startup.enabled }}
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: https
              scheme: {{ .Values.probes.readiness.scheme }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if and (not $socketMode) .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: https
              scheme: {{ .Values.probes.liveness.scheme }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or $mountTls $agentEnabled .Values.extraVolumes }}
      volumes:
        {{- if $mountTls }}
        - name: tls-bundle
          {{- if $agentManagesTls }}
          emptyDir:
            medium: Memory
          {{- else }}
          secret:
            secretName: {{ $tlsSecret | quote }}
            items:
              - key: {{ .Values.tls.secretKey | quote }}
                path: {{ include "genesis.pathBase" .Values.tls.pemBundlePath | quote }}
          {{- end }}
        {{- end }}
        {{- if $agentEnabled }}
        - name: vault-agent-socket
          emptyDir:
            medium: Memory
        - name: vault-agent-config
          configMap:
            name: {{ include "genesis.agentConfigName" . | quote }}
        - name: vault-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vault.agent.auth.audience | quote }}
                  expirationSeconds: {{ .Values.vault.agent.auth.tokenExpirationSeconds }}
            defaultMode: 0400
        {{- if .Values.vault.agent.ca.existingConfigMap }}
        - name: vault-agent-ca
          configMap:
            name: {{ .Values.vault.agent.ca.existingConfigMap | quote }}
        {{- end }}
        - name: vault-agent-scratch
          emptyDir:
            medium: Memory
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
