suite: genesis vault agent render
release:
  name: my-release
  namespace: genesis
templates:
  - deployment.yaml
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: renders native sidecar, shared volumes, and agent-only token projection
    set:
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: genesis
      vault.agent.pki.role: genesis-runtime
      vault.agent.pki.commonName: genesis.permesi.svc.cluster.local
      vault.agent.pki.dnsNames[0]: genesis.permesi.svc.cluster.local
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - exists:
          path: spec.template.metadata.annotations["checksum/vault-agent-config"]
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: vault-agent
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 10001
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: vault-agent-token
            mountPath: /var/run/secrets/vault-token
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-agent-token
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-bundle
            mountPath: /var/run/genesis/tls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-agent-socket
            mountPath: /var/run/secrets/vaultproject.io
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-agent-socket
            emptyDir:
              medium: Memory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-bundle
            emptyDir:
              medium: Memory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: vault-agent-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: vault
                    expirationSeconds: 3600
              defaultMode: 0400
      - matchRegex:
          path: spec.template.spec.initContainers[0].startupProbe.exec.command[2]
          pattern: 'vault token lookup -address="unix:///var/run/secrets/vaultproject.io/agent.sock"'
      - matchRegex:
          path: spec.template.spec.initContainers[0].startupProbe.exec.command[2]
          pattern: 'test -s "/var/run/genesis/tls/bundle.pem"'

  - it: omits the inbound PKI template in socket mode
    set:
      config.socketPath: /run/genesis.sock
      service.enabled: false
      vault.agent.enabled: true
      vault.agent.address: https://vault.example.com:8200
      vault.agent.auth.role: genesis
      serviceAccount.automount: false
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: tls-bundle
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: vault-agent-socket
            mountPath: /var/run/secrets/vaultproject.io
            readOnly: true
