---
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/permesi/genesis
  tag: 0.3.43
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  port: 8080
  socketPath: ""
  logLevel: info

database:
  dsn:
    value: postgres://postgres@postgres-genesis:5432/genesis?sslmode=disable
    existingSecret: ""
    secretKey: dsn
    externalSecret:
      remoteKey: ""
      remoteProperty: ""

tls:
  pemBundlePath: /var/run/genesis/tls/bundle.pem
  existingSecret: ""
  secretKey: bundle.pem
  externalSecret:
    remoteKey: ""
    remoteProperty: ""

vault:
  url: /var/run/secrets/vaultproject.io/agent.sock
  externalSecret:
    remoteKey: ""
    roleIdProperty: ""
    secretIdProperty: ""
  roleId:
    value: ""
    existingSecret: ""
    secretKey: role_id
  secretId:
    value: ""
    existingSecret: ""
    secretKey: secret_id
  wrappedToken:
    value: ""
    existingSecret: ""
    secretKey: wrapped_token
  transitMount: transit/genesis

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: genesis.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  readiness:
    enabled: true
    path: /ready
    scheme: HTTPS
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    enabled: true
    path: /live
    scheme: HTTPS
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30
revisionHistoryLimit: 5

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

externalSecret:
  enabled: false
  store: ""
  storeKind: ClusterSecretStore
  refreshInterval: 1h
