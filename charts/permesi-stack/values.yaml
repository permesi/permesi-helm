---
# Configure each component by setting nested values under permesi/genesis/web.
# Example:
# permesi:
#   database:
#     dsn:
#       existingSecret: permesi-db
#       secretKey: dsn
# web:
#   runtimeConfig:
#     apiBaseUrl: https://api.permesi.example.com
#     tokenBaseUrl: https://genesis.permesi.example.com
#     clientId: 00000000-0000-0000-0000-000000000000
#     opaqueServerId: api.permesi.example.com
permesi:
  enabled: true
  image:
    repository: ghcr.io/permesi/permesi
    tag: 0.4.9  # managed-by-release-bot
    digest: "sha256:d90708bff7f62227bb7230770daeda7948003bc2838e2a0793ea8160ed8a246b"  # managed-by-release-bot
    pullPolicy: IfNotPresent

genesis:
  enabled: true
  image:
    repository: ghcr.io/permesi/genesis
    tag: 0.4.9  # managed-by-release-bot
    digest: "sha256:65a8a01e34963e81ba2b3f0180dbbdb7e5322ec40701e8965f3abfd5f0087ca7"  # managed-by-release-bot
    pullPolicy: IfNotPresent

web:
  enabled: true
  image:
    repository: ghcr.io/permesi/web
    tag: 0.4.9  # managed-by-release-bot
    digest: "sha256:c3b6dcc6119a99e75e0d8257683516ad0ff64f23e2d26ecfb38849c355f09708"  # managed-by-release-bot
    pullPolicy: IfNotPresent

# Optional disposable development infrastructure. Use examples/quickstart.yaml:
# enabling this alone does not wire the component charts to these dependencies.
quickstart:
  enabled: false
  acknowledgeDevelopment: false
