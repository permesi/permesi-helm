suite: permesi ExternalSecret
release:
  name: permesi
  namespace: permesi
templates:
  - external-secret.yaml
tests:
  - it: generates default target names for each source
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      database.dsn.externalSecret.remoteKey: db-remote
      tls.externalSecret.remoteKey: tls-remote
      vault.externalSecret.remoteKey: vault-remote
      admission.paserkCa.externalSecret.remoteKey: ca-remote
    asserts:
      - equal:
          path: spec.target.name
          value: permesi-db
        documentSelector:
          path: metadata.name
          value: permesi-db
      - equal:
          path: spec.target.name
          value: permesi-tls
        documentSelector:
          path: metadata.name
          value: permesi-tls
      - equal:
          path: spec.target.name
          value: permesi-vault
        documentSelector:
          path: metadata.name
          value: permesi-vault
      - equal:
          path: spec.target.name
          value: permesi-admission-ca
        documentSelector:
          path: metadata.name
          value: permesi-admission-ca
      - equal:
          path: spec.secretStoreRef.name
          value: vault-store
        documentSelector:
          path: metadata.name
          value: permesi-db

  - it: writes both role_id and secret_id into the vault secret
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      vault.externalSecret.remoteKey: vault-remote
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: role_id
          any: true
        documentSelector:
          path: metadata.name
          value: permesi-vault
      - contains:
          path: spec.data
          content:
            secretKey: secret_id
          any: true
        documentSelector:
          path: metadata.name
          value: permesi-vault

  - it: uses explicit existingSecret as target when set
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      database.dsn.existingSecret: my-db
      database.dsn.externalSecret.remoteKey: db-remote
      vault.roleId.existingSecret: my-vault
      vault.externalSecret.remoteKey: vault-remote
    asserts:
      - equal:
          path: spec.target.name
          value: my-db
        documentSelector:
          path: metadata.name
          value: permesi-db
      - equal:
          path: spec.target.name
          value: my-vault
        documentSelector:
          path: metadata.name
          value: permesi-vault

  - it: renders an admission CA ExternalSecret without an explicit existingSecret
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      admission.paserkCa.externalSecret.remoteKey: ca-remote
    asserts:
      - equal:
          path: spec.target.name
          value: permesi-admission-ca
        documentSelector:
          path: metadata.name
          value: permesi-admission-ca
