# permesi-quickstart: disposable development dependencies.
#
# WARNING: development-only. In-memory dev Vault, ephemeral PostgreSQL, and a
# bootstrap-only credential Secret. Losing Vault while PostgreSQL is retained is
# NOT recoverable by regenerating the OPAQUE seed. Never deploy to production.
#
# acknowledgeDevelopment must be explicitly set to true before any resource is
# rendered. This is a loud gate, not a production-safety mechanism.
acknowledgeDevelopment: false

nameOverride: ""
fullnameOverride: ""

bootstrap:
  # Operator-provisioned credentials Secret. When empty, the credentials Job
  # creates "<fullname>-bootstrap-credentials" once and never regenerates it.
  # Required keys: postgres-admin-password, vault-root-token,
  # vault-permesi-password, vault-genesis-password.
  credentialsSecret: ""

  # Canonical permesi db/sql include tree. Set exactly one source.
  schema:
    # Pinned archive fetched (and sha256-verified) by the schema-acquisition
    # init container. App tag 0.4.3.
    sourceUrl: "https://github.com/permesi/permesi/archive/04783bc009cdef4e8ba71910c12ecbd25aa74dfd.tar.gz"
    sha256: "038fdc9a4ffde74f24a7bfda73567be5d8719bf95471589dc2be477907586e95"
    # Nonsecret metadata recorded on the bootstrap Job.
    revision: "04783bc009cdef4e8ba71910c12ecbd25aa74dfd"
    # Pre-packaged SQL ConfigMaps instead (air-gapped / install.sh --app-source).
    # Every *.sql key of every listed ConfigMap is copied into one flat tree.
    existingConfigMaps: []

  kubernetes:
    host: "https://kubernetes.default.svc"

  # Kubernetes auth roles bound to the actual application ServiceAccounts in
  # this namespace. Audience must match the Agent projected-token audience.
  kubernetesRoles:
    audience: "vault"
    ttl: "1h"
    maxTtl: "4h"
    permesi:
      serviceAccount: "permesi"
    genesis:
      serviceAccount: "genesis"

  pki:
    rootCommonName: "Permesi Quickstart Root CA"
    intermediateCommonName: "Permesi Quickstart Intermediate CA"
    # Listener leaf TTLs (lower for rotation tests).
    ttl: "24h"
    maxTtl: "72h"

  # Create the OIDC signing key and attach the permesi-oidc policy.
  oidcSigning:
    enabled: true

  # Actual application Service names (per-service PKI roles allow exactly
  # <name>, <name>.<ns>, <name>.<ns>.svc, <name>.<ns>.svc.cluster.local) plus
  # explicit browser-facing hostnames.
  services:
    permesi:
      serviceName: "permesi"
      browserDnsNames: ["api.localhost"]
    genesis:
      serviceName: "genesis"
      browserDnsNames: ["genesis.localhost"]

postgresql:
  image:
    repository: "docker.io/library/postgres"
    tag: "18.6"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    # Default "<fullname>-postgresql".
    name: ""
    port: 5432
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

vault:
  image:
    repository: "docker.io/hashicorp/vault"
    tag: "1.20.4"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    # Default "<fullname>-vault".
    name: ""
    port: 8200
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

credentialsJob:
  ttlSecondsAfterFinished: 3600

bootstrapJob:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 900

nodeSelector: {}
tolerations: []
