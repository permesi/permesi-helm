---
name: Release Bump PR

on:
  repository_dispatch:
    types:
      - permesi-release
  workflow_dispatch:
    inputs:
      version:
        description: App release version to bump (X.Y.Z or vX.Y.Z)
        required: true
        type: string
      chart_version:
        description: Chart version (X.Y.Z); empty = app version, or next patch when that would not advance the charts
        required: false
        type: string
        default: ''
      app_revision:
        description: Application source commit (40 hex); required for digest release qualification
        required: false
        type: string
        default: ''
      permesi_digest:
        description: Digest of ghcr.io/permesi/permesi (sha256:...)
        required: false
        type: string
        default: ''
      genesis_digest:
        description: Digest of ghcr.io/permesi/genesis (sha256:...)
        required: false
        type: string
        default: ''
      web_digest:
        description: Digest of ghcr.io/permesi/web (sha256:...)
        required: false
        type: string
        default: ''
      tag_only:
        description: Acknowledge a tag-only release without digests (clears existing digests)
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release
        id: meta
        shell: bash
        # Reads the event JSON with jq only; no event value is interpolated into shell.
        run: ./scripts/ci/release-event.sh

      - name: Bump chart versions
        id: bump
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          MODE: ${{ steps.meta.outputs.mode }}
          PERMESI_DIGEST: ${{ steps.meta.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ steps.meta.outputs.genesis_digest }}
          WEB_DIGEST: ${{ steps.meta.outputs.web_digest }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "${CHART_VERSION}" ]]; then
            args+=(--chart-version "${CHART_VERSION}")
          fi
          case "${MODE}" in
            digest)
              args+=(
                --digest "permesi=${PERMESI_DIGEST}"
                --digest "genesis=${GENESIS_DIGEST}"
                --digest "web=${WEB_DIGEST}"
              )
              ;;
            tag-only)
              args+=(--tag-only)
              ;;
            *)
              echo "Unexpected mode '${MODE}'" >&2
              exit 1
              ;;
          esac

          ./scripts/bump-release.sh "${args[@]}" "${VERSION}"

          chart_version="$(awk '/^version:/{print $2; exit}' charts/permesi-stack/Chart.yaml)"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Require exact application source for digest qualification
        if: steps.meta.outputs.mode == 'digest'
        env:
          APP_REVISION: ${{ steps.meta.outputs.app_source_sha }}
        run: |
          [[ "$APP_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Digest qualification requires the application source commit' >&2; exit 1; }

      - name: Checkout release SQL
        if: steps.meta.outputs.mode == 'digest'
        uses: actions/checkout@v7
        with:
          repository: permesi/permesi
          ref: ${{ steps.meta.outputs.app_source_sha }}
          path: app
          persist-credentials: false
          sparse-checkout: db/sql

      - name: Setup qualification Python
        if: steps.meta.outputs.mode == 'digest'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Refresh matching qualification fixtures
        if: steps.meta.outputs.mode == 'digest'
        env:
          APP_REVISION: ${{ steps.meta.outputs.app_source_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          PERMESI_DIGEST: ${{ steps.meta.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ steps.meta.outputs.genesis_digest }}
          WEB_DIGEST: ${{ steps.meta.outputs.web_digest }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            "https://github.com/permesi/permesi/archive/${APP_REVISION}.tar.gz" -o "$RUNNER_TEMP/application-source.tar.gz"
          python3 scripts/ci/refresh-release-fixture.py --app-source app \
            --archive "$RUNNER_TEMP/application-source.tar.gz" --version "$VERSION" --revision "$APP_REVISION" \
            --digest "permesi=$PERMESI_DIGEST" --digest "genesis=$GENESIS_DIGEST" --digest "web=$WEB_DIGEST"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/release-${{ steps.meta.outputs.version }}
          delete-branch: true
          sign-commits: true
          add-paths: |
            charts
            scripts/quickstart
            README.md
          draft: ${{ steps.meta.outputs.mode == 'tag-only' }}
          commit-message: 'Update charts to ${{ steps.bump.outputs.chart_version }} for app ${{ steps.meta.outputs.version }}'
          title: 'Update charts to ${{ steps.bump.outputs.chart_version }} for app ${{ steps.meta.outputs.version }}'
          body: |
            Automated release bump.

            - App version: `${{ steps.meta.outputs.version }}`
            - Chart version: `${{ steps.bump.outputs.chart_version }}`
            - Image mode: `${{ steps.meta.outputs.mode }}`
            - `ghcr.io/permesi/permesi:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.permesi_digest || 'none (tag-only)' }}`
            - `ghcr.io/permesi/genesis:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.genesis_digest || 'none (tag-only)' }}`
            - `ghcr.io/permesi/web:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.web_digest || 'none (tag-only)' }}`
            - Trigger: `${{ github.event_name }}` by `${{ steps.meta.outputs.source_actor }}`
            - Source repo: `${{ steps.meta.outputs.source_repo }}`
            - Source SHA: `${{ steps.meta.outputs.source_sha }}`
            - Source tag: `${{ steps.meta.outputs.source_tag }}`
            - Qualification SQL revision: `${{ steps.meta.outputs.app_source_sha }}`
            - Tag-only updates remain drafts until immutable qualification pins are supplied.
          labels: |-
            automation
            release

      - name: Enable pull request auto-merge
        if: steps.cpr.outputs.pull-request-number != '' && steps.meta.outputs.mode == 'digest'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Wait for pull request merge
        if: steps.cpr.outputs.pull-request-number != '' && steps.meta.outputs.mode == 'digest'
        id: merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            merge_sha="$(gh pr view "${PR_NUMBER}" --json mergeCommit,mergedAt --jq 'if .mergedAt == null then "" else .mergeCommit.oid end')"
            if [[ -n "${merge_sha}" ]]; then
              echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for PR #${PR_NUMBER} to merge." >&2
          exit 1

      - name: Trigger Charts CI on main
        if: steps.merged.outputs.merge_sha != ''
        id: charts_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_output="$(gh workflow run "Charts CI" --ref main 2>&1)"
          if [[ -n "${dispatch_output}" ]]; then
            echo "${dispatch_output}"
          fi

          run_id="$(printf '%s\n' "${dispatch_output}" | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | head -n1)"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow "Charts CI" --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"${MERGE_SHA}\") | .databaseId" | head -n1 || true)"
          fi
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow "Charts CI" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          fi

          if [[ -z "${run_id}" ]]; then
            echo "Could not determine Charts CI run id." >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for Charts CI completion
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.charts_ci.outputs.run_id }}" --exit-status

      - name: Trigger Auto Release on main
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "Auto Release" --ref main -f head_sha="${MERGE_SHA}"
