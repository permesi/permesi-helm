suite: permesi validation
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
tests:
  - it: fails when vault AppRole secrets diverge under Vault ESO
    set:
      externalSecret.enabled: true
      externalSecret.store: vault-store
      vault.externalSecret.remoteKey: vault-remote
      vault.roleId.existingSecret: secret-a
      vault.secretId.existingSecret: secret-b
    asserts:
      - failedTemplate:
          errorPattern: "must reference the same Secret"

  - it: fails when a remote key is set without an externalSecret store
    set:
      externalSecret.enabled: true
      vault.externalSecret.remoteKey: vault-remote
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.store must be set"

  - it: fails when HPA minReplicas exceeds maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 8
      autoscaling.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling.minReplicas must not exceed"
