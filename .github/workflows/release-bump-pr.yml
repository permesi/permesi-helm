---
name: Release Bump PR

on:
  repository_dispatch:
    types:
      - permesi-release
  workflow_dispatch:
    inputs:
      version:
        description: App release version to bump (X.Y.Z or vX.Y.Z)
        required: true
        type: string
      chart_version:
        description: Chart version (X.Y.Z); empty = app version, or next patch when that would not advance the charts
        required: false
        type: string
        default: ''
      permesi_digest:
        description: Digest of ghcr.io/permesi/permesi (sha256:...)
        required: false
        type: string
        default: ''
      genesis_digest:
        description: Digest of ghcr.io/permesi/genesis (sha256:...)
        required: false
        type: string
        default: ''
      web_digest:
        description: Digest of ghcr.io/permesi/web (sha256:...)
        required: false
        type: string
        default: ''
      tag_only:
        description: Resolve all immutable image digests from the published version tags
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: helm-release-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve release
        id: meta
        shell: bash
        # Reads the event JSON with jq only; no event value is interpolated into shell.
        run: ./scripts/ci/release-event.sh

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Resolve the tagged application source and published manifests
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.meta.outputs.source_tag }}
          MODE: ${{ steps.meta.outputs.mode }}
          PERMESI_DIGEST: ${{ steps.meta.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ steps.meta.outputs.genesis_digest }}
          WEB_DIGEST: ${{ steps.meta.outputs.web_digest }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          app="$RUNNER_TEMP/release-app"
          git init -q "$app"
          url=https://github.com/permesi/permesi.git
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mapfile -t tags < <(git ls-remote --refs --tags "$url" "refs/tags/$VERSION" "refs/tags/v$VERSION" | cut -f2)
            [[ ${#tags[@]} == 1 ]]
            tag="${tags[0]}"
          else
            tag="refs/tags/$SOURCE_TAG"
          fi
          git -C "$app" fetch -q --depth=1 "$url" "$tag"
          git -C "$app" checkout -q --detach 'FETCH_HEAD^{commit}'
          revision="$(git -C "$app" rev-parse HEAD)"
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$SOURCE_SHA" == "$revision" ]]
          curl -fsSL --retry 3 "https://github.com/permesi/permesi/archive/$revision.tar.gz" -o "$RUNNER_TEMP/source.tar.gz"
          args=()
          for svc in permesi genesis web; do
            var="${svc^^}_DIGEST"
            image="ghcr.io/permesi/$svc"
            digest="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$VERSION")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$MODE" == tag-only || "$digest" == "${!var}" ]]
            gh attestation verify "oci://$image@$digest" --repo permesi/permesi \
              --signer-workflow permesi/permesi/.github/workflows/release.yml --source-digest "$revision" >/dev/null
            args+=(--digest "$svc=$digest")
          done
          python3 scripts/ci/apply-release.py --app-source "$app" --archive "$RUNNER_TEMP/source.tar.gz" \
            --version "$VERSION" --revision "$revision" --chart-version "$CHART_VERSION" "${args[@]}"
          echo "chart_version=$(awk '/^version:/{print $2; exit}' charts/permesi-stack/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install packaged release and authenticate before opening the PR
        uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.32.2
      - shell: bash
        run: |
          cargo build --locked --release --manifest-path scripts/quickstart/admission/Cargo.toml --target-dir "$RUNNER_TEMP/client"
          python3 scripts/quickstart/tests/real-packaged-stack.py --context "$(kubectl config current-context)" \
            --app-source "$RUNNER_TEMP/release-app" --admission-bin "$RUNNER_TEMP/client/release/quickstart-admission"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/release-${{ steps.meta.outputs.version }}
          add-paths: |
            README.md
            charts
            scripts/quickstart/lock.json
            scripts/quickstart/chart/values.yaml
          delete-branch: true
          sign-commits: true
          commit-message: 'Update charts to ${{ steps.bump.outputs.chart_version }} (app ${{ steps.meta.outputs.version }})'
          title: 'Update charts to ${{ steps.bump.outputs.chart_version }} (app ${{ steps.meta.outputs.version }})'
          body: |
            Automated release bump.

            - App version: `${{ steps.meta.outputs.version }}`
            - Chart version: `${{ steps.bump.outputs.chart_version }}`
            - Image mode: `${{ steps.meta.outputs.mode }}`
            - `ghcr.io/permesi/permesi:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.permesi_digest || 'resolved from published tag' }}`
            - `ghcr.io/permesi/genesis:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.genesis_digest || 'resolved from published tag' }}`
            - `ghcr.io/permesi/web:${{ steps.meta.outputs.version }}` digest: `${{ steps.meta.outputs.web_digest || 'resolved from published tag' }}`
            - Trigger: `${{ github.event_name }}` by `${{ steps.meta.outputs.source_actor }}`
            - Source repo: `${{ steps.meta.outputs.source_repo }}`
            - Source SHA: `${{ steps.meta.outputs.source_sha }}`
            - Source tag: `${{ steps.meta.outputs.source_tag }}`
          labels: |-
            automation
            release

      - name: Enable pull request auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Wait for pull request merge
        if: steps.cpr.outputs.pull-request-number != ''
        id: merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            merge_sha="$(gh pr view "${PR_NUMBER}" --json mergeCommit,mergedAt --jq 'if .mergedAt == null then "" else .mergeCommit.oid end')"
            if [[ -n "${merge_sha}" ]]; then
              echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for PR #${PR_NUMBER} to merge." >&2
          exit 1

      - name: Trigger Charts CI on main
        if: steps.merged.outputs.merge_sha != ''
        id: charts_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_output="$(gh workflow run "Charts CI" --ref main 2>&1)"
          if [[ -n "${dispatch_output}" ]]; then
            echo "${dispatch_output}"
          fi

          run_id="$(printf '%s\n' "${dispatch_output}" | sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' | head -n1)"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --workflow "Charts CI" --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"${MERGE_SHA}\") | .databaseId" | head -n1 || true)"
          fi
          if [[ -z "${run_id}" ]]; then
            echo "Could not determine Charts CI run id." >&2
            exit 1
          fi

          [[ "$(gh run view "$run_id" --json headSha,headBranch,workflowName,event --jq '[.headSha,.headBranch,.workflowName,.event]|join("/")')" == "$MERGE_SHA/main/Charts CI/workflow_dispatch" ]]
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for Charts CI completion
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.charts_ci.outputs.run_id }}" --exit-status

      - name: Trigger Auto Release on main
        if: steps.charts_ci.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.merged.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "Auto Release" --ref main -f head_sha="${MERGE_SHA}"
