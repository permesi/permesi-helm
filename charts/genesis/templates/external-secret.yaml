{{- if .Values.externalSecret.enabled }}
{{- $fullname := include "genesis.fullname" . -}}
{{- $store := .Values.externalSecret.store -}}
{{- $storeKind := .Values.externalSecret.storeKind -}}
{{- $refreshInterval := .Values.externalSecret.refreshInterval -}}
{{- if dig "externalSecret" "remoteKey" "" .Values.database.dsn }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "genesis.dbSecretName" . }}
  data:
    - secretKey: {{ .Values.database.dsn.secretKey }}
      remoteRef:
        key: {{ .Values.database.dsn.externalSecret.remoteKey }}
        property: {{ default .Values.database.dsn.secretKey .Values.database.dsn.externalSecret.remoteProperty }}
{{- end }}
{{- if dig "externalSecret" "remoteKey" "" .Values.tls }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-tls
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "genesis.tlsSecretName" . }}
  data:
    - secretKey: {{ .Values.tls.secretKey }}
      remoteRef:
        key: {{ .Values.tls.externalSecret.remoteKey }}
        property: {{ default .Values.tls.secretKey .Values.tls.externalSecret.remoteProperty }}
{{- end }}
{{- if dig "externalSecret" "remoteKey" "" .Values.vault }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-vault
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "genesis.vaultEsoTarget" . }}
  data:
    - secretKey: {{ .Values.vault.roleId.secretKey }}
      remoteRef:
        key: {{ .Values.vault.externalSecret.remoteKey }}
        property: {{ default .Values.vault.roleId.secretKey .Values.vault.externalSecret.roleIdProperty }}
    - secretKey: {{ .Values.vault.secretId.secretKey }}
      remoteRef:
        key: {{ .Values.vault.externalSecret.remoteKey }}
        property: {{ default .Values.vault.secretId.secretKey .Values.vault.externalSecret.secretIdProperty }}
{{- end }}
{{- end }}
