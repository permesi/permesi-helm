---
name: Publish Charts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to publish (X.Y.Z or vX.Y.Z)
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          raw="$RAW_VERSION"

          version="${raw#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected X.Y.Z or vX.Y.Z, got '${raw}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require the published tag and its successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git fetch --no-tags origin "refs/tags/v$VERSION"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$(git rev-parse HEAD)" ]]
          gh release view "v$VERSION" --json isDraft --jq '.isDraft == false' | grep -qx true
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$(git rev-parse HEAD)" ]]
          bash scripts/ci/require-release-ci.sh

      - name: Validate chart versions
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for chart in charts/*; do
            chart_file="${chart}/Chart.yaml"
            [[ -f "${chart_file}" ]] || continue

            chart_version="$(awk '/^version:/{print $2; exit}' "${chart_file}")"
            if [[ "${chart_version}" != "${VERSION}" ]]; then
              echo "${chart_file} has version ${chart_version}, expected ${VERSION}" >&2
              exit 1
            fi
          done

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p .packages
          for chart in charts/*; do
            [[ -f "${chart}/Chart.yaml" ]] || continue
            if grep -q '^dependencies:' "${chart}/Chart.yaml"; then
              helm dependency build "${chart}"
            fi
            helm package "${chart}" --destination .packages
          done

      - name: Push charts to GHCR OCI
        run: |-
          set -euo pipefail
          shopt -s nullglob
          for package in .packages/*.tgz; do
            helm push "${package}" oci://ghcr.io/permesi/charts
          done
