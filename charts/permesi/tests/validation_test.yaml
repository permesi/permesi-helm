suite: permesi validation
release:
  name: permesi
  namespace: permesi
templates:
  - deployment.yaml
tests:
  - it: fails when OpenBao AppRole secrets diverge under ESO
    set:
      externalSecret.enabled: true
      externalSecret.store: openbao-store
      openbao.externalSecret.remoteKey: openbao-remote
      openbao.roleId.existingSecret: secret-a
      openbao.secretId.existingSecret: secret-b
    asserts:
      - failedTemplate:
          errorPattern: "must reference the same Secret"

  - it: fails when a remote key is set without an externalSecret store
    set:
      externalSecret.enabled: true
      openbao.externalSecret.remoteKey: openbao-remote
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.store must be set"

  - it: fails when HPA minReplicas exceeds maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 8
      autoscaling.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling.minReplicas must not exceed"

  - it: rejects a stale vault values block
    set:
      vault.url: https://vault.example.com:8200
    asserts:
      - failedTemplate:
          errorPattern: "vault values block was renamed to openbao"

  - it: rejects the removed secretsProvider switch
    set:
      secretsProvider: openbao
    asserts:
      - failedTemplate:
          errorPattern: "secretsProvider was removed"

  - it: rejects the removed PASERK admission URL and CA settings
    set:
      admission.paserkUrl: https://genesis.example.com/paserk.json
    asserts:
      - failedTemplate:
          errorPattern: "paserkUrl"

  - it: rejects the removed Agent PASERK CA template
    set:
      openbao.agent.paserkCa.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "paserkCa"

  - it: rejects OpenBao and admission settings passed through extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_PASERK_URL
          value: https://genesis.example.com/paserk.json
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"

  - it: requires a pinned application image
    set:
      image.digest: ""
    asserts:
      - failedTemplate:
          errorPattern: "require pinned application and OpenBao Agent images"

  - it: rejects PERMESI_OPENBAO_URL in extraEnv
    set:
      extraEnv:
        - name: PERMESI_OPENBAO_URL
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects GENESIS_OPENBAO_ROLE_ID in extraEnv
    set:
      extraEnv:
        - name: GENESIS_OPENBAO_ROLE_ID
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects PERMESI_ADMISSION_ISS in extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_ISS
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects PERMESI_ADMISSION_AUD in extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_AUD
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: rejects PERMESI_ADMISSION_PASERK_CA_PATH in extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_PASERK_CA_PATH
          value: override
    asserts:
      - failedTemplate:
          errorPattern: "Use managed values for OpenBao and admission trust"


  - it: accepts the admission tuning setting PERMESI_ADMISSION_REFRESH_SECONDS in extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_REFRESH_SECONDS
          value: "10"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_ADMISSION_REFRESH_SECONDS
            value: "10"


  - it: accepts the admission tuning setting PERMESI_ADMISSION_MAX_AGE_SECONDS in extraEnv
    set:
      extraEnv:
        - name: PERMESI_ADMISSION_MAX_AGE_SECONDS
          value: "10"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PERMESI_ADMISSION_MAX_AGE_SECONDS
            value: "10"


  - it: rejects the removed admission.paserkCaPath setting
    set:
      admission.paserkCaPath: /var/run/permesi/ca.pem
    asserts:
      - failedTemplate:
          errorPattern: "paserkCa"


  - it: rejects the removed admission.paserkCa.existingSecret setting
    set:
      admission.paserkCa.existingSecret: legacy-ca
    asserts:
      - failedTemplate:
          errorPattern: "paserkCa"
